<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saarthi People OS — Working Demo</title>
<style>
:root{--navy:#0f172a;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--indigo:#4f46e5;--purple:#7c3aed;--green:#059669;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 13px;font-weight:650;transition:.15s}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c7d2fe;outline-offset:2px}.primary{background:var(--indigo);color:white}.primary:hover{background:#4338ca}.secondary{background:#eef2ff;color:#3730a3}.neutral{background:#f1f5f9;color:#334155}.success{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#991b1b}.small{padding:6px 9px;font-size:12px}.muted{color:var(--muted)}.tiny{font-size:11px}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:white;padding:12px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 4px 14px #0f172a18}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:19px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--indigo),var(--purple));font-size:20px}.brand small{display:inline-block;margin-left:5px;padding:2px 7px;border:1px solid #334155;border-radius:20px;color:#c4b5fd;font-size:10px;vertical-align:middle}.top-actions{display:flex;align-items:center;gap:8px}.top-actions select{max-width:190px;background:#1e293b;color:white;border:1px solid #475569;border-radius:9px;padding:8px}
.layout{max-width:1320px;margin:auto;padding:22px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.sidebar,.panel,.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 7px #0f172a05}.sidebar{padding:14px;align-self:start;position:sticky;top:82px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:#94a3b8;text-transform:uppercase;padding:10px}.nav{display:grid;gap:4px}.nav button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;color:#475569;font-size:12.5px;border-radius:9px}.nav button.active,.nav button:hover{background:#eef2ff;color:#3730a3}.sidebar .summary{margin-top:16px;padding:12px;background:#f8fafc;border-radius:12px;font-size:12px}
.main{min-width:0}.section-title{font-size:18px;font-weight:750;margin:0 0 4px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}.metric{padding:14px 16px}.metric strong{display:block;font-size:22px;font-weight:800}.metric span{font-size:12px;color:var(--muted)}
.card{padding:16px 18px}.table-card{padding:0;overflow:hidden}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:10px 14px;background:#f8fafc;font-weight:700;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.04em}td{padding:10px 14px;border-top:1px solid var(--line)}tr:hover td{background:#fafbff}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.approved,.done{background:#dcfce7;color:#166534}.open{background:#dbeafe;color:#1e40af}.resolved{background:#e2e8f0;color:#334155}
.progress{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--purple));border-radius:10px}
.onboard-step{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.onboard-step:last-child{border:0}
.actions{display:flex;gap:6px;align-items:center}
.modal-bg{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;z-index:100;padding:20px}.modal{background:white;border-radius:16px;max-width:480px;width:100%;padding:20px;box-shadow:0 20px 40px #0f172a40}.modal h3{margin:0 0 12px}.form-row{margin-bottom:12px}.form-row label{display:block;font-size:12px;font-weight:650;margin-bottom:4px}.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:white}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:12px 18px;border-radius:12px;z-index:200;font-size:13px;box-shadow:0 10px 25px #0f172a40;opacity:0;transition:opacity .2s}
.chat-box{max-height:280px;overflow-y:auto;padding:10px;background:#f8fafc;border-radius:12px;margin-bottom:10px}.bubble{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%;font-size:13px}.bot{background:#eef2ff;color:#3730a3}.user{background:var(--indigo);color:white;margin-left:auto}
.filter-bar{margin-bottom:10px;display:flex;gap:8px}.filter-bar input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.menu-toggle{display:none;background:transparent;color:white;font-size:20px;padding:4px 8px}
@media(max-width:900px){
  .layout{grid-template-columns:1fr;padding:12px}
  .sidebar{position:fixed;left:0;top:60px;bottom:0;width:260px;z-index:20;transform:translateX(-100%);transition:.2s;border-radius:0 16px 16px 0}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .topbar{padding:10px 14px}
  .metrics{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="loginScreen" style="min-height:100vh;display:grid;place-items:center;padding:20px">
  <div class="card" style="max-width:420px;width:100%">
    <div class="brand" style="margin-bottom:16px"><div class="logo">S</div> Saarthi <small>People OS</small></div>
    <h2 style="margin:0 0 6px">Working Demo</h2>
    <p class="muted tiny" style="margin:0 0 16px">Practical people-ops workspace for early-stage teams. <strong>Not for real or sensitive data.</strong></p>
    <form id="loginForm">
      <div class="form-row"><label>Your name</label><input id="loginName" required placeholder="Demo User" value="Demo User"></div>
      <div class="form-row"><label>Role</label>
        <select id="loginRole">
          <option value="founder">Founder / CEO</option>
          <option value="hr">People Ops / HR</option>
          <option value="manager">Team Manager</option>
          <option value="employee">Employee</option>
          <option value="candidate">Candidate</option>
        </select>
      </div>
      <div class="form-row"><label>Access code</label><input id="demoCode" required placeholder="demo123" value="demo123"></div>
      <button class="primary" type="submit" style="width:100%">Enter workspace</button>
    </form>
    <p class="tiny muted" style="margin:12px 0 0">Code: demo123 · Data stays in this browser only.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><button class="menu-toggle" id="menuToggle">☰</button><div class="logo">S</div> Saarthi <small>People OS</small></div>
    <div class="top-actions">
      <span id="greeting" style="font-size:13px"></span>
      <select id="roleSelector" aria-label="Demo role"></select>
      <button class="neutral small" id="exportDataBtn" title="Download a backup of this demo data">Export data</button>
      <button class="neutral small" id="importDataBtn" title="Restore data from a Saarthi JSON backup">Import data</button>
      <button class="neutral small" id="resetDemoBtn" title="Reset this browser's demo data to the original sample">Reset demo</button>
      <input type="file" id="importDataFile" accept="application/json,.json" class="hidden" aria-label="Choose Saarthi backup file">
      <button class="secondary small" id="aiOpen">Ask Saarthi</button>
      <button class="neutral small" id="logoutBtn">Logout</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="eyebrow">Navigation</div>
      <nav class="nav" id="nav"></nav>
      <div class="summary" id="sidebarSummary"></div>
    </aside>
    <main class="main" id="mainContent"></main>
  </div>
</div>

<div id="modalBg" class="modal-bg hidden"><div class="modal" id="modalContent"></div></div>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';
const STORE_KEY='saarthi_people_os_demo_v3';
const seedData={
  activeRole:'founder', displayName:'Demo User',
  employees:[
    {id:1,name:'Ananya Sharma',role:'Product Designer',location:'Bengaluru',join:'2025-08-12',manager:'Arjun Das',status:'Active'},
    {id:2,name:'Rohan Mehta',role:'Backend Engineer',location:'Remote',join:'2025-03-04',manager:'Arjun Das',status:'Active'},
    {id:3,name:'Priya Verma',role:'People Ops Associate',location:'Delhi NCR',join:'2024-11-18',manager:'Founder',status:'Active'},
    {id:4,name:'Vikram Patel',role:'Sales Lead',location:'Mumbai',join:'2025-01-20',manager:'Founder',status:'Active'},
    {id:5,name:'Siddharth Nair',role:'Frontend Engineer',location:'Bengaluru',join:'2025-06-01',manager:'Arjun Das',status:'Active'}
  ],
  leaves:[
    {id:1,employee:'Ananya Sharma',type:'Casual Leave',days:2,date:'2026-10-28',reason:'Personal work',status:'Pending',approver:''},
    {id:2,employee:'Rohan Mehta',type:'Sick Leave',days:1,date:'2026-10-20',reason:'Fever',status:'Approved',approver:'Manager'}
  ],
  reimbursements:[
    {id:101,employee:'Priya Verma',category:'Software / SaaS',amount:2499,desc:'Figma Subscription',status:'Pending',approver:''},
    {id:102,employee:'Vikram Patel',category:'Client Lunch',amount:1850,desc:'Meeting with prospective client',status:'Approved',approver:'Founder'}
  ],
  shoutouts:[
    {id:1,from:'Arjun Das',to:'Rohan Mehta',badge:'🚀 Champion',text:'Kudos for resolving the production database latency bug within 30 minutes!'},
    {id:2,from:'People Ops',to:'Priya Verma',badge:'💡 Innovator',text:'Great onboarding presentation for the new engineering cohort!'}
  ],
  tickets:[
    {id:201,user:'Ananya Sharma',subject:'Laptop replacement request',priority:'Medium',status:'Open'},
    {id:301,user:'Siddharth Nair',subject:'Tax Declaration Verification',priority:'High',status:'Open'}
  ],
  onboarding:[
    {id:1,title:'Workspace & tools provisioning',detail:'Google Workspace, Slack, GitHub and Figma access',status:'Done',owner:'IT / HR'},
    {id:2,title:'Founder culture & product overview',detail:'Intro session and product roadmap review',status:'Done',owner:'Founder'},
    {id:3,title:'First feature commit & code review',detail:'Ship a first improvement with mentor supervision',status:'In Progress',owner:'Manager'},
    {id:4,title:'30-day goals alignment',detail:'Set clear expectations and success metrics',status:'In Progress',owner:'Manager'}
  ]
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return clone(seedData);
    const parsed=JSON.parse(raw);
    return {...clone(seedData),...parsed,
      employees:Array.isArray(parsed.employees)?parsed.employees:clone(seedData.employees),
      leaves:Array.isArray(parsed.leaves)?parsed.leaves:clone(seedData.leaves),
      reimbursements:Array.isArray(parsed.reimbursements)?parsed.reimbursements:clone(seedData.reimbursements),
      shoutouts:Array.isArray(parsed.shoutouts)?parsed.shoutouts:clone(seedData.shoutouts),
      tickets:Array.isArray(parsed.tickets)?parsed.tickets:clone(seedData.tickets),
      onboarding:Array.isArray(parsed.onboarding)?parsed.onboarding:clone(seedData.onboarding)
    };
  }catch(e){console.warn(e);return clone(seedData)}
}
let storageWarningShown=false;
function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}
  catch(e){
    console.warn('Saarthi could not persist this session in browser storage.',e);
    if(!storageWarningShown){storageWarningShown=true;notify('Browser storage is unavailable. The demo will work, but changes may not survive a refresh.');}
  }
}
let state=loadState(), currentTab='dashboard', toastTimer;
const $=id=>document.getElementById(id);
const roles={
  founder:{badge:'FOUNDER / CEO',nav:[['dashboard','Executive Dashboard','▦'],['playbook','Founders’ Playbook','📘'],['directory','Team Directory','👥'],['rewards','Rewards & Culture','🏆'],['leaves','Leave Approvals','📅'],['reimbursements','Expense Claims','₹'],['helpdesk','Support Helpdesk','🎧']]},
  hr:{badge:'PEOPLE OPS / HR',nav:[['dashboard','People Ops Hub','♙'],['playbook','Founders’ Playbook','📘'],['directory','Team Directory','👥'],['onboarding','Onboarding Engine','🚀'],['leaves','Leave Management','📅'],['reimbursements','Reimbursements','₹'],['helpdesk','Helpdesk Tickets','🎧'],['rewards','Rewards & Culture','🏆']]},
  manager:{badge:'TEAM MANAGER',nav:[['dashboard','Team Dashboard','▦'],['leaves','Team Leave Requests','📅'],['reimbursements','Expense Approvals','₹'],['rewards','Give Shoutout','🏆'],['helpdesk','Helpdesk Tickets','🎧']]},
  employee:{badge:'EMPLOYEE SELF-SERVICE',nav:[['dashboard','My Workspace','⌂'],['leaves','My Leaves','📅'],['reimbursements','My Expense Claims','₹'],['rewards','Recognition Wall','🏆'],['helpdesk','HR Helpdesk','?'],['onboarding','My Onboarding','🚀']]},
  candidate:{badge:'CANDIDATE PORTAL',nav:[['candidate_portal','Application Status','✎'],['helpdesk','Candidate Support','🎧']]}
};
function notify(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,2400)}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function pageHead(title,sub,extra=''){return `<div class="page-head"><div><h2 class="section-title">${title}</h2><p class="muted tiny">${sub}</p></div>${extra}</div>`}

function renderApp(){
  const role=state.activeRole;
  const r=roles[role];
  $('greeting').textContent=`Hi, ${escapeHTML(state.displayName)}`;
  $('roleSelector').innerHTML=Object.keys(roles).map(k=>`<option value="${k}" ${k===role?'selected':''}>${roles[k].badge}</option>`).join('');
  $('nav').innerHTML=r.nav.map(([id,label,icon])=>`<button class="${id===currentTab?'active':''}" data-tab="${id}">${icon} ${label}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;renderApp();if(window.innerWidth<900)$('sidebar').classList.remove('open')}));
  const pendingL=state.leaves.filter(l=>l.status==='Pending').length;
  const pendingR=state.reimbursements.filter(r=>r.status==='Pending').length;
  $('sidebarSummary').innerHTML=`<div><strong>${state.employees.length}</strong> active headcount</div><div class="tiny muted" style="margin-top:4px">${pendingL} leave · ${pendingR} expense pending</div>`;
  const el=$('mainContent');
  if(currentTab==='dashboard') renderDashboard(el,role);
  else if(currentTab==='playbook') renderPlaybook(el);
  else if(currentTab==='directory') renderDirectory(el);
  else if(currentTab==='onboarding') renderOnboarding(el);
  else if(currentTab==='leaves') renderLeaves(el,role);
  else if(currentTab==='reimbursements') renderReimbursements(el,role);
  else if(currentTab==='rewards') renderRewards(el,role);
  else if(currentTab==='helpdesk') renderHelpdesk(el,role);
  else if(currentTab==='candidate_portal') renderCandidate(el);
}

function renderDashboard(el,role){
  const pendingL=state.leaves.filter(l=>l.status==='Pending').length;
  const pendingR=state.reimbursements.filter(r=>r.status==='Pending').length;
  const openT=state.tickets.filter(t=>t.status==='Open').length;
  const totalLeaveDays=state.leaves.reduce((s,l)=>s+Number(l.days||0),0);
  const totalExp=state.reimbursements.reduce((s,r)=>s+Number(r.amount||0),0);
  el.innerHTML=pageHead(role==='founder'?'Executive Dashboard':role==='hr'?'People Ops Hub':role==='manager'?'Team Dashboard':role==='candidate'?'Candidate Overview':'My Workspace','Snapshot of people operations.')+
  `<div class="metrics">
    <div class="card metric"><strong>${state.employees.length}</strong><span>Headcount</span></div>
    <div class="card metric"><strong>${pendingL}</strong><span>Pending leaves</span></div>
    <div class="card metric"><strong>${pendingR}</strong><span>Pending claims</span></div>
    <div class="card metric"><strong>${openT}</strong><span>Open tickets</span></div>
    <div class="card metric"><strong>${totalLeaveDays}</strong><span>Leave days (sample)</span></div>
    <div class="card metric"><strong>₹${totalExp.toLocaleString('en-IN')}</strong><span>Claims total</span></div>
  </div>`+
  (['founder','hr','manager'].includes(role)?`<div class="card"><h3 style="margin:0 0 10px">Pending approvals</h3>${pendingL+pendingR===0?'<p class="muted">All clear.</p>':state.leaves.filter(l=>l.status==='Pending').map(l=>`<div class="tiny" style="margin:4px 0">Leave: ${escapeHTML(l.employee)} · ${l.days}d · ${escapeHTML(l.type)}</div>`).join('')+state.reimbursements.filter(r=>r.status==='Pending').map(r=>`<div class="tiny" style="margin:4px 0">Claim: ${escapeHTML(r.employee)} · ₹${r.amount} · ${escapeHTML(r.category)}</div>`).join('')}</div>`:'');
}

function renderPlaybook(el){
  el.innerHTML=pageHead('Founders’ Playbook','Practical notes. Validate with legal/tax professionals before adopting.')+
  `<div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 6px">Hiring & onboarding</h3><p class="tiny">Define 30-60-90 expectations early. Document tools access and culture norms. For India: collect Form 11 (PF) and other statutory forms during onboarding.</p></div>
  <div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 6px">Equity & ESOPs</h3><p class="tiny">Document eligibility, vesting, exercise windows, dilution, and tax treatment clearly. Get the plan reviewed by qualified counsel.</p></div>
  <div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 6px">Remote & hybrid</h3><p class="tiny">Set clear async norms, core hours, and expense guidelines for remote setups.</p></div>
  <div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 6px">India statutory reminders</h3><p class="tiny">POSH: Internal Committee required above 10 employees. PF/ESI thresholds apply. Casual/Sick/Earned leave are common; Maternity (26 weeks) and Paternity policies should be explicit. Leave encashment and gratuity have specific rules. Always confirm with a qualified professional.</p></div>
  <div class="card"><h3 style="margin:0 0 6px">Performance & goals</h3><p class="tiny">Lightweight OKRs or quarterly goals beat heavyweight systems at this stage. Tie recognition to outcomes.</p></div>`;
}

function renderDirectory(el){
  el.innerHTML=pageHead('Team Directory','Sample employee list.')+
  `<div class="filter-bar"><input id="dirFilter" placeholder="Filter by name, role, location..."></div>
  <div class="card table-card"><div class="table-wrap"><table id="dirTable"><thead><tr><th>Name</th><th>Role</th><th>Location</th><th>Join date</th><th>Manager</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>`;
  function draw(){const q=($('dirFilter').value||'').toLowerCase();const rows=state.employees.filter(e=>!q||[e.name,e.role,e.location,e.manager].some(x=>String(x).toLowerCase().includes(q)));$('dirTable').querySelector('tbody').innerHTML=rows.map(e=>`<tr><td><strong>${escapeHTML(e.name)}</strong></td><td>${escapeHTML(e.role)}</td><td>${escapeHTML(e.location)}</td><td>${escapeHTML(e.join)}</td><td>${escapeHTML(e.manager)}</td><td><span class="pill approved">${escapeHTML(e.status)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No matches</td></tr>'}
  draw();$('dirFilter').addEventListener('input',draw);
}

function renderOnboarding(el){
  const done=state.onboarding.filter(s=>s.status==='Done').length;
  const pct=Math.round((done/state.onboarding.length)*100);
  el.innerHTML=pageHead('Onboarding Engine','Sample 30-60-90 checklist.')+
  `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin:0">October 2026 cohort</h3><p class="muted tiny">Progress across sample steps</p></div><strong style="color:#4f46e5">${pct}%</strong></div><div class="progress" style="margin:12px 0 16px"><span style="width:${pct}%"></span></div>${state.onboarding.map(s=>`<div class="onboard-step"><div><strong style="font-size:13px">${escapeHTML(s.title)}</strong><div class="muted tiny">${escapeHTML(s.detail)} · Owner: ${escapeHTML(s.owner)}</div></div><div class="actions"><span class="pill ${s.status==='Done'?'done':'pending'}">${escapeHTML(s.status)}</span><button class="secondary small" data-step="${s.id}">${s.status==='Done'?'Reopen':'Mark done'}</button></div></div>`).join('')}</div>`;
  el.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const s=state.onboarding.find(x=>x.id===Number(b.dataset.step));if(s){s.status=s.status==='Done'?'In Progress':'Done';saveState();renderApp();notify('Step updated')}}));
}

function renderLeaves(el,role){
  const canApprove=['founder','hr','manager'].includes(role);
  el.innerHTML=pageHead(role==='employee'?'My leave requests':'Leave management','Apply and review. India-aware types noted.',`<button class="primary" id="applyLeave">+ Apply leave</button>`)+
  `<div class="filter-bar"><input id="leaveFilter" placeholder="Filter employee or type..."></div>
  <div class="card table-card"><div class="table-wrap"><table id="leaveTable"><thead><tr><th>Employee</th><th>Type</th><th>Days</th><th>Date</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>`;
  function draw(){const q=($('leaveFilter').value||'').toLowerCase();let rows=state.leaves;if(role==='employee')rows=rows.filter(l=>l.employee===state.displayName);rows=rows.filter(l=>!q||l.employee.toLowerCase().includes(q)||l.type.toLowerCase().includes(q));$('leaveTable').querySelector('tbody').innerHTML=rows.map(l=>`<tr><td><strong>${escapeHTML(l.employee)}</strong></td><td>${escapeHTML(l.type)}</td><td>${l.days}</td><td>${escapeHTML(l.date)}</td><td>${escapeHTML(l.reason)}</td><td><span class="pill ${l.status.toLowerCase()}">${l.status}${l.approver?' · '+escapeHTML(l.approver):''}</span></td><td>${l.status==='Pending'&&canApprove?`<div class="actions"><button class="success small" data-approve="${l.id}">Approve</button><button class="danger small" data-reject="${l.id}">Reject</button></div>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No requests</td></tr>'}
  draw();$('leaveFilter').addEventListener('input',draw);
  $('applyLeave').addEventListener('click',()=>openForm('Apply for leave',[
    {name:'type',label:'Leave type',type:'select',options:['Casual Leave','Sick Leave','Earned Leave','Unpaid Leave','Maternity (note: confirm eligibility)','Paternity'],required:true},
    {name:'days',label:'Number of days',type:'number',min:1,required:true,value:'1'},
    {name:'date',label:'Start date',type:'date',required:true,value:'2026-11-01'},
    {name:'reason',label:'Reason',type:'textarea',required:true}
  ],v=>{state.leaves.unshift({id:Date.now(),employee:state.displayName,type:v.type,days:Math.max(1,Number(v.days)||1),date:v.date,reason:v.reason,status:'Pending',approver:''});saveState();renderApp();notify('Leave submitted')}));
  el.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>{const l=state.leaves.find(x=>x.id===Number(b.dataset.approve));if(l){l.status='Approved';l.approver=role;saveState();renderApp();notify('Leave approved')}}));
  el.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click',()=>{const l=state.leaves.find(x=>x.id===Number(b.dataset.reject));if(l){l.status='Rejected';l.approver=role;saveState();renderApp();notify('Leave rejected')}}));
}

function renderReimbursements(el,role){
  const canApprove=['founder','hr','manager'].includes(role);
  el.innerHTML=pageHead(role==='employee'?'My expense claims':'Reimbursements','Submit and review claims.',`<button class="primary" id="newClaim">+ New claim</button>`)+
  `<div class="card table-card"><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Category</th><th>Amount</th><th>Description</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.reimbursements.filter(r=>role!=='employee'||r.employee===state.displayName).map(r=>`<tr><td><strong>${escapeHTML(r.employee)}</strong></td><td>${escapeHTML(r.category)}</td><td>₹${Number(r.amount).toLocaleString('en-IN')}</td><td>${escapeHTML(r.desc)}</td><td><span class="pill ${r.status.toLowerCase()}">${r.status}</span></td><td>${r.status==='Pending'&&canApprove?`<div class="actions"><button class="success small" data-approve-r="${r.id}">Approve</button><button class="danger small" data-reject-r="${r.id}">Reject</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('newClaim').addEventListener('click',()=>openForm('New expense claim',[
    {name:'category',label:'Category',type:'select',options:['Software / SaaS','Client Lunch','Travel','Office Supplies','Other'],required:true},
    {name:'amount',label:'Amount (₹)',type:'number',min:1,required:true},
    {name:'desc',label:'Description',type:'textarea',required:true}
  ],v=>{state.reimbursements.unshift({id:Date.now(),employee:state.displayName,category:v.category,amount:Number(v.amount),desc:v.desc,status:'Pending',approver:''});saveState();renderApp();notify('Claim submitted')}));
  el.querySelectorAll('[data-approve-r]').forEach(b=>b.addEventListener('click',()=>{const r=state.reimbursements.find(x=>x.id===Number(b.dataset.approveR));if(r){r.status='Approved';r.approver=role;saveState();renderApp();notify('Claim approved')}}));
  el.querySelectorAll('[data-reject-r]').forEach(b=>b.addEventListener('click',()=>{const r=state.reimbursements.find(x=>x.id===Number(b.dataset.rejectR));if(r){r.status='Rejected';r.approver=role;saveState();renderApp();notify('Claim rejected')}}));
}

function renderRewards(el,role){
  el.innerHTML=pageHead('Rewards & Culture','Peer recognition wall.',role!=='candidate'?`<button class="primary" id="giveShout">+ Give shoutout</button>`:'')+
  `<div class="card">${state.shoutouts.map(s=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><strong>${escapeHTML(s.from)} → ${escapeHTML(s.to)}</strong><span>${escapeHTML(s.badge)}</span></div><p class="tiny" style="margin:4px 0 0">${escapeHTML(s.text)}</p></div>`).join('')||'<p class="muted">No shoutouts yet.</p>'}</div>`;
  const btn=$('giveShout');if(btn)btn.addEventListener('click',()=>openForm('Give a shoutout',[
    {name:'to',label:'To (name)',type:'text',required:true},
    {name:'badge',label:'Badge',type:'select',options:['🚀 Champion','💡 Innovator','🤝 Collaborator','🎯 Closer','🌟 Rising Star'],required:true},
    {name:'text',label:'Message',type:'textarea',required:true}
  ],v=>{state.shoutouts.unshift({id:Date.now(),from:state.displayName,to:v.to,badge:v.badge,text:v.text});saveState();renderApp();notify('Shoutout shared')}));
}

function renderHelpdesk(el,role){
  const canResolve=['founder','hr'].includes(role);
  const ownOnly=['employee','manager','candidate'].includes(role);
  const visibleTickets=state.tickets.filter(t=>!ownOnly||t.user===state.displayName);
  el.innerHTML=pageHead(role==='employee'?'HR Helpdesk':role==='manager'?'Team Helpdesk':role==='candidate'?'Candidate Support':'Helpdesk','Raise and track requests. Only People Ops and founders can resolve tickets.',`<button class="primary" id="raiseTicket">+ Raise ticket</button>`)+
  `<div class="metrics">
    <div class="card metric"><strong>${visibleTickets.length}</strong><span>My visible tickets</span></div>
    <div class="card metric"><strong>${visibleTickets.filter(t=>t.status==='Open').length}</strong><span>Open</span></div>
    <div class="card metric"><strong>${visibleTickets.filter(t=>t.status==='Resolved').length}</strong><span>Resolved</span></div>
  </div><div class="card table-card"><div class="table-wrap"><table><thead><tr><th>User</th><th>Subject</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody>${visibleTickets.map(t=>`<tr><td>${escapeHTML(t.user)}</td><td>${escapeHTML(t.subject)}</td><td>${escapeHTML(t.priority)}</td><td><span class="pill ${t.status.toLowerCase()}">${escapeHTML(t.status)}</span></td><td>${t.status==='Open'&&canResolve?`<button class="success small" data-resolve="${t.id}">Resolve</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No tickets yet. Raise a ticket if you need help.</td></tr>'}</tbody></table></div></div>`;
  $('raiseTicket').addEventListener('click',()=>openForm('Raise ticket',[
    {name:'subject',label:'Subject',type:'text',required:true},
    {name:'priority',label:'Priority',type:'select',options:['Low','Medium','High'],required:true}
  ],v=>{state.tickets.unshift({id:Date.now(),user:state.displayName,subject:v.subject,priority:v.priority,status:'Open'});saveState();renderApp();notify('Ticket raised')}));
  el.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>{const t=state.tickets.find(x=>x.id===Number(b.dataset.resolve));if(t){t.status='Resolved';t.resolvedBy=role;t.resolvedAt=new Date().toISOString();saveState();renderApp();notify('Ticket resolved')}}));
}

function renderCandidate(el){
  el.innerHTML=pageHead('Application Status','Illustrative candidate portal.')+
  `<div class="metrics"><div class="card metric"><strong>Interview scheduled</strong><span>Demo application status</span></div><div class="card metric"><strong>People Ops</strong><span>Support contact</span></div></div>
  <div class="card"><h3>What happens next?</h3><p class="muted">Your recruiter will share the next steps and interview details. This is sample data only and is not connected to a real applicant tracking system.</p><button class="primary" id="candidateSupport">Contact candidate support</button></div>`;
  $('candidateSupport').addEventListener('click',()=>openForm('Contact candidate support',[
    {name:'subject',label:'What do you need help with?',type:'text',required:true},
    {name:'priority',label:'Priority',type:'select',options:['Low','Medium','High'],required:true}
  ],v=>{state.tickets.unshift({id:Date.now(),user:state.displayName,subject:'Candidate: '+v.subject,priority:v.priority,status:'Open'});saveState();currentTab='helpdesk';renderApp();notify('Support request submitted')}));
}

function openForm(title,fields,onSubmit){
  const bg=$('modalBg'),c=$('modalContent');
  c.innerHTML=`<h3>${escapeHTML(title)}</h3>`+fields.map(f=>`<div class="form-row"><label for="field-${f.name}">${escapeHTML(f.label)}</label>${f.type==='select'?`<select id="field-${f.name}" name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option>${escapeHTML(o)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea id="field-${f.name}" name="${f.name}" rows="3" ${f.required?'required':''}></textarea>`:`<input id="field-${f.name}" name="${f.name}" type="${f.type||'text'}" ${f.min?'min="'+f.min+'"':''} ${f.required?'required':''} value="${escapeHTML(f.value||'')}">`}</div>`).join('')+`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button type="button" class="neutral" id="modalCancel">Cancel</button><button type="button" class="primary" id="modalOk">Submit</button></div>`;
  bg.classList.remove('hidden');
  $('modalCancel').onclick=()=>bg.classList.add('hidden');
  $('modalOk').onclick=()=>{const data={};for(const f of fields){const el=c.querySelector(`[name="${f.name}"]`);if(el&&!el.checkValidity()){el.reportValidity();return}data[f.name]=el?el.value.trim():''}if(fields.some(f=>f.required&&!data[f.name])){notify('Please fill required fields');return}onSubmit(data);bg.classList.add('hidden')};
}

function openAi(){
  const bg=$('modalBg'),c=$('modalContent');
  c.innerHTML=`<h3>Ask Saarthi</h3><div class="chat-box" id="chatBox"><div class="bubble bot">Hi! I can help with leave, expenses, onboarding, ESOPs, policies, or helpdesk. What do you need?</div></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Type a question..." style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px"><button class="primary small" id="chatSend">Send</button></div><div style="text-align:right;margin-top:8px"><button class="neutral small" id="aiClose">Close</button></div>`;
  bg.classList.remove('hidden');
  function addBubble(kind,text){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=text;$('chatBox').appendChild(b);$('chatBox').scrollTop=$('chatBox').scrollHeight}
  function reply(q){
    const lower=q.toLowerCase();
    let answer='I can guide you on leave, expenses, onboarding, ESOPs, compliance, or helpdesk. Confirm company-specific rules with your People team.';
    if(lower.includes('leave'))answer='Open Leave Management and choose “Apply leave”. Supported types include Casual, Sick, Earned, Unpaid. Maternity/Paternity eligibility should be confirmed with HR and policy.';
    else if(lower.includes('expense')||lower.includes('reimburse')||lower.includes('claim'))answer='Open Reimbursements and select “New claim”. Add category, amount and description. The demo stores it locally.';
    else if(lower.includes('onboard'))answer='Open Onboarding Engine to review the sample checklist. Mark steps done to update progress.';
    else if(lower.includes('esop')||lower.includes('equity'))answer='ESOPs need clear eligibility, vesting, exercise, dilution and tax documentation. Have the plan reviewed by legal and tax professionals.';
    else if(lower.includes('policy')||lower.includes('compliance')||lower.includes('posh')||lower.includes('pf'))answer='Use the Playbook as a starting point. For India: POSH IC required above certain headcount, PF/ESI thresholds apply, and leave/gratuity rules are specific. Validate with a qualified professional.';
    else if(lower.includes('helpdesk')||lower.includes('ticket'))answer='Open Helpdesk Tickets, raise a ticket, and Founder/HR roles can mark it resolved.';
    setTimeout(()=>addBubble('bot',answer),150);
  }
  $('chatSend').onclick=()=>{const q=$('chatInput').value.trim();if(!q)return;addBubble('user',q);$('chatInput').value='';reply(q)};
  $('chatInput').onkeydown=e=>{if(e.key==='Enter'){$('chatSend').click()}};
  $('aiClose').onclick=()=>bg.classList.add('hidden');
  $('chatInput').focus();
}

window.saarthiLogin=function(e){
  if(e)e.preventDefault();
  const code=$('demoCode').value.trim();
  if(code!=='demo123'){notify('Demo code did not match. Enter demo123.');$('demoCode').focus();return false;}
  state.displayName=$('loginName').value.trim()||'Demo User';
  state.activeRole=$('loginRole').value;
  saveState();
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  currentTab=roles[state.activeRole].nav[0][0];
  $('roleSelector').value=state.activeRole;
  renderApp();
  notify('Welcome to the Saarthi demo');
  return false;
};
$('loginForm').addEventListener('submit',window.saarthiLogin);
$('roleSelector').addEventListener('change',e=>{state.activeRole=e.target.value;currentTab=roles[state.activeRole].nav[0][0];saveState();renderApp()});
$('aiOpen').addEventListener('click',openAi);
$('exportDataBtn').addEventListener('click',()=>{
  const backup={app:'Saarthi People OS',schemaVersion:1,exportedAt:new Date().toISOString(),data:state};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='saarthi-people-os-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  notify('Backup downloaded. Store it somewhere safe.');
});
$('importDataBtn').addEventListener('click',()=>$('importDataFile').click());
$('resetDemoBtn').addEventListener('click',()=>{
  if(!window.confirm('Reset all Saarthi demo records in this browser to the original sample data? Export a backup first if you want to keep your changes.'))return;
  state=clone(seedData);
  saveState();
  currentTab=roles[state.activeRole].nav[0][0];
  $('roleSelector').value=state.activeRole;
  renderApp();
  notify('Demo data reset to the original sample.');
});
$('importDataFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    if(!window.confirm('Importing a backup replaces the current demo data in this browser. Export a backup first if you want to keep the current data. Continue?'))return;
    if(file.size>2*1024*1024)throw new Error('Backup must be 2 MB or smaller.');
    const parsed=JSON.parse(await file.text());
    const incoming=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;
    const arrays=['employees','leaves','reimbursements','shoutouts','tickets','onboarding'];
    if(!incoming||!arrays.every(k=>Array.isArray(incoming[k])))throw new Error('This file is not a valid Saarthi backup. Required data sections are missing.');
    if(incoming.activeRole&&!roles[incoming.activeRole])throw new Error('The backup contains an unsupported role.');
    const restored={...clone(seedData),...incoming};
    arrays.forEach(k=>{if(!Array.isArray(restored[k]))throw new Error('Invalid '+k+' section.')});
    state=restored;
    saveState();
    $('roleSelector').value=roles[state.activeRole]?state.activeRole:'founder';
    currentTab=roles[state.activeRole]?roles[state.activeRole].nav[0][0]:'dashboard';
    renderApp();
    notify('Backup restored successfully.');
  }catch(err){notify(err.message||'Could not restore this backup.');}
  finally{e.target.value='';}
});
$('logoutBtn').addEventListener('click',()=>{$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('demoCode').value=''});
$('menuToggle').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
document.addEventListener('click',e=>{if(e.target.id==='modalBg')$('modalBg').classList.add('hidden')});
})();
</script>
