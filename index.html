<title>Saarthi People OS — Working Demo</title>

.main{min-width:0}.section-title{font-size:18px;font-weight:750;margin:0 0 4px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}.metric{padding:14px 16px}.metric strong{display:block;font-size:22px;font-weight:800}.metric span{font-size:12px;color:var(--muted)}
.card{padding:16px 18px}.table-card{padding:0;overflow:hidden}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:10px 14px;background:#f8fafc;font-weight:700;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.04em}td{padding:10px 14px;border-top:1px solid var(--line)}tr:hover td{background:#fafbff}

.progress{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--purple));border-radius:10px}

/* Saarthi visual refresh: calmer surfaces, clearer hierarchy, responsive polish */
:root{
  --navy:#111827;--ink:#182338;--muted:#68758a;--line:#e5eaf2;--bg:#f4f6fb;
  --indigo:#4f46e5;--purple:#8b5cf6;--green:#0f9f78;--amber:#b7791f;--red:#dc4545;
  --surface:#ffffff;--soft-indigo:#eef2ff;--shadow-sm:0 2px 8px rgba(20,32,58,.045);
  --shadow-md:0 12px 32px rgba(20,32,58,.075);
}
body{background:radial-gradient(ellipse at 8% 0%,rgba(99,102,241,.07),transparent 32%),var(--bg);color:var(--ink);letter-spacing:-.01em}
button{border-radius:11px;min-height:36px}
button:active{transform:translateY(1px)}
.primary{background:linear-gradient(135deg,#5145e5,#6d4de6);box-shadow:0 4px 10px rgba(79,70,229,.16)}
.primary:hover{background:linear-gradient(135deg,#4338ca,#5b21b6);box-shadow:0 6px 16px rgba(79,70,229,.22);transform:translateY(-1px)}
.secondary{background:#eef2ff;color:#4338ca}
.neutral{background:#f1f4f9;color:#344256}
.neutral:hover{background:#e8edf5}
.topbar{background:linear-gradient(110deg,#111827 0%,#18213a 70%,#29245a 100%);padding:13px clamp(14px,2.4vw,30px);box-shadow:0 5px 22px rgba(15,23,42,.16);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{letter-spacing:-.035em;font-size:20px}
.logo{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(79,70,229,.28)}
.layout{max-width:1440px;padding:26px clamp(12px,2.5vw,32px);gap:22px}
.sidebar,.panel,.card{border-color:#e6eaf2;box-shadow:var(--shadow-sm)}
.sidebar{padding:13px;border-radius:18px;background:rgba(255,255,255,.94)}
.nav{gap:5px}
.nav button{padding:10px 11px;font-size:13px;transition:background .15s,color .15s,transform .15s}
.nav button.active{background:linear-gradient(100deg,#eef2ff,#f4f0ff);color:#4338ca;box-shadow:inset 3px 0 0 #635bdf;font-weight:750}
.nav button:hover{transform:translateX(2px)}
.sidebar .summary{background:linear-gradient(135deg,#f8fafc,#f3f4ff);border:1px solid #edf0f8;line-height:1.65}
.section-title{font-size:20px;letter-spacing:-.035em;color:#17213a}
.page-head{align-items:center;margin-bottom:20px}
.metrics{gap:14px;margin-bottom:20px}
.metric{position:relative;overflow:hidden;padding:17px 18px;border-radius:16px;background:linear-gradient(145deg,#fff,#fbfcff);transition:transform .18s,box-shadow .18s}
.metric:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.metric:after{content:"";position:absolute;right:-22px;top:-28px;width:84px;height:84px;border-radius:50%;background:rgba(99,102,241,.055)}
.metric strong{font-size:27px;letter-spacing:-.045em;line-height:1.25;color:#17213a}
.metric span{display:inline-block;margin-top:5px;line-height:1.4}
.card{padding:18px 20px;border-radius:17px}
.table-card{padding:0}
th{padding:12px 15px;background:#f7f8fc;color:#69758b;font-size:10px;letter-spacing:.075em}
td{padding:12px 15px}
tr:hover td{background:#f8f9ff}
.pill{padding:4px 10px;letter-spacing:.01em}
.progress{height:9px;background:#edf0f6}
.onboard-step{padding:14px 2px}
.modal-bg{backdrop-filter:blur(5px);background:rgba(15,23,42,.58)}
.modal{border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:24px;box-shadow:0 28px 70px rgba(15,23,42,.28)}
.modal h3{letter-spacing:-.03em}
.form-row{margin-bottom:15px}
.form-row label{color:#344256;font-size:12px;margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea,.filter-bar input{padding:10px 12px;border-color:#dfe5ef;border-radius:10px;transition:border-color .15s,box-shadow .15s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus,.filter-bar input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.1);outline:none}
.chat-box{background:#f6f7fc;border:1px solid #eceffa}
.bubble{padding:10px 13px;border-radius:14px;line-height:1.55}
.bot{background:#eef2ff;color:#38318b}
.toast{border:1px solid #374151;box-shadow:0 12px 32px rgba(15,23,42,.22)}
#loginScreen{background:radial-gradient(ellipse at 18% 15%,rgba(129,140,248,.2),transparent 35%),radial-gradient(ellipse at 85% 85%,rgba(167,139,250,.18),transparent 32%),linear-gradient(135deg,#f7f8ff,#f5f7fb 52%,#f0edff)}
#loginScreen>.card{padding:30px;border-radius:24px;border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(38,48,85,.12);backdrop-filter:blur(12px)}
#loginScreen .brand{font-size:23px}
#loginScreen h2{font-size:25px;letter-spacing:-.045em;color:#17213a}
#loginScreen form button{width:100%;margin-top:4px}
@media(max-width:900px){
  .layout{padding:14px;gap:14px}
  .sidebar{box-shadow:var(--shadow-md)}
  .page-head{align-items:flex-start}
  .top-actions{gap:6px;flex-wrap:wrap;justify-content:flex-end}
}
@media(max-width:560px){
  .topbar{gap:8px;align-items:flex-start}
  .brand{font-size:17px;gap:7px}
  .brand small{font-size:9px;margin-left:2px}
  .logo{width:34px;height:34px}
  .top-actions{max-width:58%;font-size:12px}
  .top-actions select{max-width:145px;padding:7px;font-size:12px}
  .layout{padding:10px}
  .metrics{gap:9px}
  .metric{padding:13px;border-radius:14px}
  .metric strong{font-size:23px}
  .card{padding:15px}
  .page-head{gap:8px}
  .section-title{font-size:18px}
  #loginScreen>.card{padding:23px}
  .modal-bg{padding:12px}
  .modal{padding:18px;border-radius:17px}
}

/* Respect native hidden state when onboarding filters hide a step */
.onboard-step[hidden]{display:none!important}
/* Product-wide interaction and readability pass */
:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}
a{color:#4338ca;text-underline-offset:3px}
a:hover{color:#312e81}
input,select,textarea{max-width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#94a0b3}
.card,.panel,.sidebar{transition:border-color .16s,box-shadow .16s}
.card:hover{border-color:#dce3f0}
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filter-bar input{flex:1;min-width:190px}
.table-wrap{max-width:100%;overscroll-behavior-x:contain}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
td,th{vertical-align:middle}
td .tiny,td .muted{line-height:1.45}
button:disabled{cursor:not-allowed;opacity:.48;box-shadow:none;transform:none}
.stat-card{border:1px solid #e8ecf5;border-radius:14px;background:linear-gradient(145deg,#fff,#fafbff);padding:15px}
.stat-card strong{display:block;font-size:22px;letter-spacing:-.035em;line-height:1.3;color:#1c2850;margin:5px 0}
.stat-card small{display:block;color:#6c7890;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:5px;max-width:100%;white-space:normal;line-height:1.35}
@media(max-width:700px){
  .page-head{display:flex;flex-direction:column;align-items:stretch}
  .filter-bar input{min-width:100%;width:100%}
  .card{min-width:0}
  .grid-cards{grid-template-columns:1fr 1fr}
  .section-head{gap:10px;flex-wrap:wrap}
  .section-head>div{min-width:0}
  .section-head input[type=date]{max-width:100%!important}
}
@media(max-width:420px){
  .grid-cards{grid-template-columns:1fr}
  .top-actions{max-width:62%}
  .top-actions select{max-width:125px}
  .modal{max-height:calc(100dvh - 24px);overflow:auto}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
{
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* Saarthi compass: make the five values visible in daily work without adding a new module */
.saarthi-compass{margin:0 0 16px;padding:16px 18px;background:linear-gradient(115deg,#fff 0%,#f8faff 100%)}
.compass-heading{display:flex;gap:12px;align-items:flex-start}
.compass-star{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:12px;background:#eef2ff;color:#5145e5;font-size:21px}
.compass-heading h3{margin:0 0 3px;font-size:15px}
.compass-heading p{margin:0;color:var(--muted);font-size:12px}
.compass-eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:#6366f1;margin-bottom:3px}
.compass-values{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.compass-values span{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.compass-values b{font-size:11px}
.compass-values small{font-size:10px;line-height:1.35;color:var(--muted)}
@media(max-width:700px){.compass-values{grid-template-columns:repeat(2,minmax(0,1fr))}.compass-values span:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.saarthi-compass *{transition:none!important}}

/* Founder dashboard: guided, calm, actionable */
.founder-hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:255px;padding:clamp(22px,3.5vw,38px);margin-bottom:18px;border-radius:23px;color:#fff;background:linear-gradient(112deg,#171c3b 0%,#28245b 58%,#4b36a5 100%);box-shadow:0 18px 42px rgba(44,39,108,.18)}
.founder-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 80% 20%,rgba(167,139,250,.25),transparent 28%),radial-gradient(circle at 55% 100%,rgba(99,102,241,.25),transparent 38%)}
.founder-hero-copy{max-width:590px;position:relative;z-index:1}
.founder-kicker{font-size:10px;font-weight:850;letter-spacing:.14em;color:#8177ee;text-transform:uppercase}
.founder-hero .founder-kicker{color:#c4baff}
.founder-hero h2{font-size:clamp(25px,3vw,36px);line-height:1.12;letter-spacing:-.05em;margin:12px 0;color:#fff;max-width:560px}
.founder-hero p{max-width:520px;font-size:13px;line-height:1.8;color:#d6d8f1;margin:0 0 22px}
.founder-hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.founder-hero-actions button{padding:10px 15px}
.hero-primary{background:#fff;color:#332778;box-shadow:0 5px 16px rgba(10,10,35,.16)}
.hero-primary:hover{background:#f2f0ff}
.hero-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.hero-secondary:hover{background:rgba(255,255,255,.18)}
.founder-hero-art{position:relative;flex:0 0 220px;height:200px;display:grid;place-items:center;margin-right:12px}
.orbit{position:absolute;border:1px solid rgba(221,214,254,.23);border-radius:50%;transform:rotate(-25deg)}
.orbit-one{width:190px;height:125px}.orbit-two{width:150px;height:190px;transform:rotate(45deg)}
.orbit-core{width:88px;height:88px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(145deg,#a5b4fc,#8b5cf6);border:1px solid rgba(255,255,255,.4);box-shadow:0 0 0 12px rgba(196,181,253,.08),0 15px 35px rgba(10,10,40,.28);font-size:43px;font-weight:850;color:#fff}
.orbit-chip{position:absolute;padding:7px 10px;border:1px solid rgba(255,255,255,.22);border-radius:11px;background:rgba(27,25,73,.68);backdrop-filter:blur(8px);font-size:10px;font-weight:750;color:#f5f3ff;box-shadow:0 7px 20px rgba(0,0,0,.12)}
.chip-one{top:15px;left:7px}.chip-two{right:-15px;top:63px}.chip-three{bottom:12px;left:26px}
.founder-start-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;margin-bottom:22px}
.founder-setup-card,.founder-insight-card{padding:20px}
.founder-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.founder-section-heading h3,.founder-insight-card h3{margin:4px 0 0;font-size:17px;letter-spacing:-.03em;color:#1b2540}
.setup-count{font-size:11px;font-weight:750;color:#5b50ca;background:#f0efff;padding:5px 9px;border-radius:20px}
.founder-setup-card>.progress{margin-bottom:10px;height:6px}
.founder-task{display:flex;width:100%;align-items:center;gap:11px;padding:13px 0;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid #edf0f6;color:var(--ink)}
.founder-task:last-child{border-bottom:0;padding-bottom:2px}
.founder-task:hover{background:#fafaff}
.task-icon{flex:0 0 31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#f0efff;color:#6557d8;font-size:10px;font-weight:850}
.founder-task>span:nth-child(2){display:grid;gap:3px;flex:1}
.founder-task strong{font-size:12px}
.founder-task small,.pulse-row small,.founder-quick-card small{display:block;font-size:10px;line-height:1.5;color:#7b8497;font-weight:450}
.task-status{white-space:nowrap;font-size:10px;font-weight:800;color:#5b50ca}
.task-complete{color:#0f9f78}
.founder-insight-card h3{margin-bottom:14px}
.pulse-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f6}
.pulse-row:last-of-type{border-bottom:0}
.pulse-row>span:nth-child(2){flex:1;min-width:0}
.pulse-row strong{display:block;font-size:12px}
.pulse-icon{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:10px;font-size:15px;font-weight:800}
.pulse-indigo{background:#eef2ff;color:#4f46e5}.pulse-violet{background:#f3e8ff;color:#7e22ce}.pulse-green{background:#dcfce7;color:#15803d}
.pulse-row button{background:transparent;color:#5b50ca;padding:5px;font-size:10px;white-space:nowrap}
.mini-progress{width:55px;height:6px;border-radius:10px;background:#edf0f6;overflow:hidden}.mini-progress span{display:block;height:100%;background:#8b5cf6;border-radius:10px}
.founder-demo-note{margin:13px 0 0;font-size:9px;line-height:1.6;color:#929bad}
.founder-quick-heading{margin:2px 0 12px}
.founder-quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.founder-quick-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:145px;text-align:left;padding:17px;border-radius:16px;color:var(--ink);transition:transform .16s,box-shadow .16s,border-color .16s}
.founder-quick-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,32,58,.09);border-color:#d7d9ff}
.quick-symbol{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;font-size:18px;font-weight:800}
.quick-blue{background:#eaf1ff;color:#4562d9}.quick-lilac{background:#f1edff;color:#7757cf}.quick-green{background:#e3f8ef;color:#0e8a68}.quick-amber{background:#fff3dc;color:#b7791f}
.founder-quick-card strong{font-size:12px;margin-top:4px}
.founder-quick-card small{padding-right:10px}

function founderCharterInsight(c){
  c=c||{}; const vals=Array.isArray(c.values)?c.values:[]; const prompts=[];
  if(!c.description)prompts.push('Describe your customer, the problem you solve and what makes your approach different.');
  if(!c.vision)prompts.push('Describe the future you want the company to help create.');
  if(!c.mission)prompts.push('Connect that ambition to what you do for customers today.');
  if(!c.purpose)prompts.push('Explain why this work matters beyond revenue or growth.');
  if(!vals.length)prompts.push('Co-create 3–5 values with People Ops, each with behaviours to encourage and avoid.');
  else prompts.push('Make “'+vals[0]+'” observable: what would a teammate actually see someone do?');
  if(!c.curationNotes)prompts.push('Invite HR / People Ops to challenge the draft with real examples from the team.');
  if(!c.description&&!c.vision&&!c.mission&&!c.purpose&&!vals.length)return 'Start in plain language. Saarthi can help explore the capabilities, behaviours and values that support your ambition. These are guided prototype reflections, not live AI analysis yet.';
  return 'A useful working draft. '+prompts.slice(0,2).join(' ');
}

 function drawGrowthArchetypes(){

   const contextList=(Array.isArray(state.growthContexts)?state.growthContexts:[]).filter(c=>String(c.employee||'').trim().toLowerCase()===p.name.toLowerCase()&&(isMine({employee:p.name})||['hr','founder'].includes(role)||(role==='manager'&&reports.includes(p.name.toLowerCase())&&c.shareWithManager)));

function wireSaarthiAi(el,role,signals){
  const prompts=el.querySelectorAll('[data-ai-prompt]');
  const question=el.querySelector('#saarthiAiQuestion');
  const answer=el.querySelector('#saarthiAiAnswer');
  const reply=q=>{const text=String(q||'').toLowerCase();let message='Start with the most time-sensitive item, confirm the owner and next action, and communicate any blocker early. This is general guidance based on the demo experience, not an AI-generated assessment.';
    if(text.includes('approval')||text.includes('approv')||text.includes('leave'))message=signals.pendingApprovals?('You have '+signals.pendingApprovals+' pending approval item(s) in the current demo view. Review policy, dates, team coverage and supporting details before deciding. Do not use leave history or performance assumptions as a reason to penalize a request.'):'There are no pending approval items in the current demo view. If a new request arrives, check eligibility, policy and team coverage before deciding.';
    else if(text.includes('workload')||text.includes('bottleneck')||text.includes('attention')||text.includes('priorit'))message=signals.openItems?('There are '+signals.openItems+' open or pending item(s) in the current role view. Start with items that block another person, have a deadline, or lack a clear owner. Confirm the facts with the relevant teammate before escalating.'):'No open or pending items were detected in the current demo signals. Check upcoming deadlines and ask the team whether any unrecorded blockers need help.';
    else if(text.includes('onboard')||text.includes('prerequisite')||text.includes('blocker'))message=signals.blockedOnboarding?('There are '+signals.blockedOnboarding+' onboarding step(s) blocked by unfinished prerequisites in the current view. Resolve or reassign the prerequisite first; do not mark the dependent task overdue against its owner while it is blocked. Confirm the dependency and responsible person before changing dates.'):'No prerequisite-blocked onboarding steps were detected in the current view. Review incomplete steps with owners and check whether any dependencies are missing.';
    else if(text.includes('interview')||text.includes('recruiter'))message='Review the role description, prepare two examples of your work, and note questions about the team and next steps. Confirm interview timing and format with your recruiter; this demo does not contain live application status.';
    else if(text.includes('1:1')||text.includes('next')||text.includes('request'))message=signals.myPending?('You have '+signals.myPending+' pending personal request(s) in this demo. Check the request status and any follow-up needed; if a decision is time-sensitive, contact the listed approver politely.'):'No pending personal requests were detected in the current demo signals. Review your assigned tasks and choose one clear next action.';
    answer.textContent=message;};
  prompts.forEach(btn=>btn.addEventListener('click',()=>reply(btn.textContent)));
  el.querySelector('#saarthiAiForm')?.addEventListener('submit',event=>{event.preventDefault();const q=question.value.trim();if(!q){answer.textContent='Enter a question or choose a suggested prompt.';return}reply(q)});
}

    '<section class="card" style="margin-bottom:14px"><div class="eyebrow">FIRST WORKFLOW · RECRUITMENT</div><h3>Prepare a hiring brief</h3><p class="muted tiny">Create a structured, human-reviewable brief from information you provide. This local demo uses a transparent template, not a connected generative AI service; avoid entering sensitive candidate data.</p><div class="form-grid"><label>Role / vacancy<input id="briefRole" maxlength="120" value="'+escapeHTML(plan.role==='Recruitment Associate'?'Recruitment Associate':plan.role)+'" placeholder="e.g. Customer Success Associate"></label><label>Hiring goal<input id="briefGoal" maxlength="240" placeholder="What outcome should this hire own?"></label><label style="grid-column:1/-1">Approved context / key requirements<textarea id="briefContext" maxlength="1500" rows="3" placeholder="Add role requirements, responsibilities, and context without personal or confidential data"></textarea></label><label style="grid-column:1/-1">Human reviewer<input id="briefReviewer" maxlength="80" value="'+escapeHTML(plan.owner||'Founder')+'" placeholder="Name or role responsible for review"></label><button class="primary" type="button" id="buildHiringBrief">Prepare review brief</button></div><div id="hiringBriefOutput" aria-live="polite" style="margin-top:12px"></div></section>'+
    '<section class="card"><h3>What Saarthi should measure</h3><div class="grid-cards"><div><strong>Useful output</strong><p class="muted tiny">Tasks completed and quality checked</p></div><div><strong>Human review</strong><p class="muted tiny">Items waiting for approval or escalation</p></div><div><strong>Cost and value</strong><p class="muted tiny">Actual operating cost against outcomes</p></div><div><strong>Handover readiness</strong><p class="muted tiny">Documentation for the human joining the role</p></div></div></section>';
  const save=()=>{
    plan.role=$('aiRole').value;
    plan.budget=Math.max(0,Math.min(10000000,Number($('aiBudget').value)||0));
    plan.owner=$('aiOwner').value.trim().slice(0,80)||'Founder';
    plan.tasks=Array.from(el.querySelectorAll('[data-ai-task]:checked')).map(x=>x.dataset.aiTask);
    plan.approvals=$('aiApproval').checked;
    plan.status='Planning';
  };
  $('aiRole').addEventListener('change',()=>{save();plan.tasks=[];renderAIWorkforce(el);});
  $('saveAIPlan').addEventListener('click',()=>{save();plan.status='Planning';renderAIWorkforce(el);$('aiPlanStatus').textContent='AI workforce plan saved in this browser demo. No AI worker is connected.';});
  $('buildHiringBrief').addEventListener('click',()=>{
    const roleTitle=$('briefRole').value.trim();
    const goal=$('briefGoal').value.trim();
    const context=$('briefContext').value.trim();
    const reviewer=$('briefReviewer').value.trim();
    const out=$('hiringBriefOutput');
    if(!roleTitle||!goal||!context||!reviewer){out.innerHTML='<p class="danger" role="alert">Add the role, hiring goal, context and reviewer before preparing the brief.</p>';return;}
    const safe=v=>escapeHTML(v);
    out.innerHTML='<section class="card" style="background:#f8fafc"><div class="section-head"><h4>Hiring brief · '+safe(roleTitle)+'</h4><button type="button" class="secondary small" id="copyHiringBrief">Copy brief</button></div><p><strong>Hiring goal</strong><br>'+safe(goal)+'</p><p><strong>Requirements and context</strong><br>'+safe(context).replace(/\n/g,'<br>')+'</p><p><strong>Review checklist</strong></p><ul><li>Confirm requirements are job-related and inclusive.</li><li>Validate the role scope and success measures with the hiring manager.</li><li>Do not use AI-generated content as an automated candidate decision.</li><li>Review any candidate-facing communication before sending.</li></ul><p class="tiny muted">Prepared locally from supplied inputs. Reviewer: '+safe(reviewer)+'. No external AI service was called and no message was sent.</p></section>';
    const brief='Hiring brief: '+roleTitle+'\nHiring goal: '+goal+'\nRequirements and context: '+context+'\nReviewer: '+reviewer+'\nReview: validate job-related inclusive criteria, role scope, success measures, and all candidate-facing communication. No automated candidate decision.';
    $('copyHiringBrief').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(brief);$('copyHiringBrief').textContent='Copied';}catch(e){out.insertAdjacentHTML('beforeend','<p class="tiny muted">Clipboard access is unavailable in this browser. Select and copy the brief manually.</p>');}});
  });
  $('activateAIPlan').addEventListener('click',()=>{
    save();
    if(!plan.approvals){$('aiPlanStatus').textContent='Add mandatory human-review safeguards before marking a pilot ready.';return;}
    if(!plan.tasks.length){$('aiPlanStatus').textContent='Select at least one suitable task before marking a pilot ready.';return;}
    plan.status='Pilot planned';
    renderAIWorkforce(el);
    $('aiPlanStatus').textContent='Pilot plan saved locally. No AI worker has been activated.';
  });
}

function renderPeopleBudget(el){
  state.peopleBudget=state.peopleBudget||{period:'2026-Q4',currency:'INR',budget:0,existingAnnualCost:0,notes:'',decisions:[]};
  const b=state.peopleBudget;
  state.resourceRequisitions=Array.isArray(state.resourceRequisitions)?state.resourceRequisitions:[];
  state.projects=Array.isArray(state.projects)?state.projects:[];
  const money=n=>b.currency+' '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
  const approved=state.resourceRequisitions.filter(x=>x.status==='Approved').reduce((sum,x)=>sum+Math.max(0,Number(x.budgetMin)||0),0);
  const proposed=state.resourceRequisitions.filter(x=>['Pending review','Pending'].includes(x.status)).reduce((sum,x)=>sum+Math.max(0,Number(x.budgetMin)||0),0);
  const total=Number(b.existingAnnualCost||0)+approved;
  const remaining=Number(b.budget||0)-total-proposed;
  el.innerHTML=pageHead('People Budget','Make people-cost decisions with clear assumptions, project context and trade-offs.')+
    '<section class="card" style="margin-bottom:14px"><div class="card-head"><div><div class="eyebrow" style="padding:0 0 6px;color:var(--indigo)">GUIDANCE · START WITH THE WORK</div><h3>Budget guardrails</h3><p class="muted tiny">Set your planning envelope. This demo uses annualised figures; amounts are only as reliable as the inputs you provide.</p></div></div><form id="peopleBudgetForm" class="form-grid"><label>Planning period<input name="period" maxlength="40" required value="'+escapeHTML(b.period)+'"></label><label>Currency<select name="currency">'+['INR','USD','GBP','EUR','SGD'].map(c=>'<option '+(b.currency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label>People budget for period<input name="budget" type="number" min="0" step="1" required value="'+Number(b.budget||0)+'"></label><label>Existing annual people cost<input name="existingAnnualCost" type="number" min="0" step="1" required value="'+Number(b.existingAnnualCost||0)+'"></label><label style="grid-column:1/-1">Assumptions / what is included<textarea name="notes" maxlength="1000" rows="2" placeholder="e.g. salaries only; employer costs not yet included">'+escapeHTML(b.notes||'')+'</textarea></label><button class="primary" type="submit">Save budget assumptions</button></form><p class="tiny muted">Saarthi principle: show the basis, not false precision. Requisition totals use the entered minimum budget only; upper ranges and unlisted employer costs, recruitment, onboarding, equipment and tools are not included in these totals.</p></section>'+
    '<div class="metrics"><div class="card metric"><strong>'+money(b.budget)+'</strong><span>Budget envelope</span></div><div class="card metric"><strong>'+money(total)+'</strong><span>Existing cost + approved requisition budget floors</span></div><div class="card metric"><strong>'+money(proposed)+'</strong><span>Proposed requisition budget floors</span></div><div class="card metric"><strong>'+money(remaining)+'</strong><span>Indicative remaining · before unlisted costs</span></div></div>'+
    (remaining<0?'<section class="card" role="alert" style="margin-top:-6px;margin-bottom:16px;border-color:#fecaca;background:#fff7f7"><strong style="color:#b91c1c">People budget exceeded</strong><p class="tiny" style="margin:5px 0 0;color:#7f1d1d">Current existing costs and approved requisition budget floors exceed the planning envelope by '+money(Math.abs(remaining))+'. Review assumptions and options before committing to additional spend.</p></section>':Number(b.budget)>0&&remaining/Number(b.budget)<.1?'<section class="card" role="status" style="margin-top:-6px;margin-bottom:16px;border-color:#fde68a;background:#fffbeb"><strong style="color:#92400e">Limited budget headroom</strong><p class="tiny" style="margin:5px 0 0;color:#78350f">Less than 10% of the planning envelope remains before unlisted costs. Recheck assumptions and the full cost of proposed roles.</p></section>':'')+
    '<section class="card" style="margin-top:16px"><div class="card-head"><div><h3>People needs vs work needs</h3><p class="muted tiny">Start with the outcome and capacity gap. A workload gap does not automatically mean you need a hire.</p></div></div><div class="grid-cards"><article class="card"><h4>People requirement</h4><p class="muted tiny">Which skills and capacity are missing? Compare hiring with development, redeployment or contracting before opening a role.</p><button class="secondary" id="budgetReqLink">Review resource requisitions</button></article><article class="card"><h4>Work requirement</h4><p class="muted tiny">Which outcome matters, by when, and what effort or dependencies stand in the way? Link the proposed spend to the work it enables.</p><button class="secondary" id="budgetProjectLink">Review projects & OKRs</button></article></div></section>'+
    '<section class="card" style="margin-top:16px"><div class="card-head"><div><h3>Project value & people-cost decisions</h3><p class="muted tiny">Make the trade-off visible: outcome, option, cost, evidence, risk and the next decision. No ROI is claimed until inputs are supplied.</p></div><button class="primary" id="newPeopleDecision">＋ Add decision</button></div>'+
    ((b.decisions||[]).length?'<div class="table-wrap"><table><thead><tr><th>Project / outcome</th><th>Option</th><th>Estimated annual cost</th><th>Expected annual value</th><th>Value less cost</th><th>Decision owner</th><th>Assumptions / risks</th></tr></thead><tbody>'+b.decisions.map(d=>{const enough=Number(d.cost)>0&&Number(d.value)>0;return '<tr><td>'+escapeHTML(d.project)+'</td><td>'+escapeHTML(d.option)+'</td><td>'+money(d.cost)+'</td><td>'+money(d.value)+'</td><td>'+(enough?money(Number(d.value)-Number(d.cost)):'Insufficient inputs')+'</td><td>'+escapeHTML(d.owner||'Not assigned')+'</td><td>'+escapeHTML(d.assumptions||'Not provided')+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted tiny">No decisions added yet. Start with a project, expected outcome, cost estimate and value assumption.</p>')+
    '<p class="tiny muted">Value less cost is a simple planning comparison, not guaranteed ROI. It excludes unentered costs, risk, timing and uncertainty. Do not use it as a promise of financial return.</p></section>';
  $('peopleBudgetForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget);b.period=String(d.get('period')||'').trim();b.currency=String(d.get('currency')||'INR');b.budget=Math.max(0,Number(d.get('budget'))||0);b.existingAnnualCost=Math.max(0,Number(d.get('existingAnnualCost'))||0);b.notes=String(d.get('notes')||'').trim();saveState();renderApp();notify('People budget assumptions saved.');});
  $('budgetReqLink').addEventListener('click',()=>{currentTab='requisitions';renderApp();});
  $('budgetProjectLink').addEventListener('click',()=>{currentTab='projects';renderApp();});
  $('newPeopleDecision').addEventListener('click',()=>openForm('Add people-cost decision',[
    {name:'project',label:'Project / business outcome',type:'text',required:true},
    {name:'option',label:'Option',type:'select',options:['Hire employee','Contractor','Redistribute work','Develop internal skills','Automate','Defer / re-scope'],required:true},
    {name:'cost',label:'Estimated annual cost ('+b.currency+')',type:'number',min:0,required:true},
    {name:'value',label:'Expected annual value ('+b.currency+')',type:'number',min:0,required:true},
    {name:'owner',label:'Decision owner / approver',type:'text',required:true},
    {name:'assumptions',label:'Evidence, assumptions, one-off costs and risks',type:'textarea',required:true}
  ],v=>{const cost=Number(v.cost),value=Number(v.value),assumptions=String(v.assumptions||'').trim();if(!Number.isFinite(cost)||cost<0||!Number.isFinite(value)||value<0){notify('Enter valid non-negative cost and value estimates.');return false}if(assumptions.length<8){notify('Add the basis for the estimate and key risks.');return false}b.decisions=Array.isArray(b.decisions)?b.decisions:[];b.decisions.unshift({id:Date.now(),project:v.project.trim(),option:v.option,cost,value,owner:String(v.owner||'').trim(),assumptions,createdAt:new Date().toISOString()});saveState();renderApp();notify('Decision added with assumptions.');}));
}

function renderDashboard(el,role){

  const directReportNames=new Set(state.employees.filter(e=>String(e.manager||'').trim().toLowerCase()===String(state.displayName||'').trim().toLowerCase()).map(e=>e.name));
  const managerRole=role==='manager';
  const pendingLeaveRows=state.leaves.filter(l=>l.status==='Pending'&&(!managerRole||directReportNames.has(l.employee)));
  const pendingExpenseRows=state.reimbursements.filter(r=>r.status==='Pending'&&(!managerRole||directReportNames.has(r.employee)));
  const pendingL=pendingLeaveRows.length;
  const pendingR=pendingExpenseRows.length;
  const openT=state.tickets.filter(t=>t.status==='Open').length;
  const totalLeaveDays=state.leaves.reduce((sum,l)=>sum+Number(l.days||0),0);
  const totalExp=state.reimbursements.reduce((sum,r)=>sum+Number(r.amount||0),0);
  const isFounder=role==='founder';
  const settings=state.companySettings||{};
  const companyName=settings.name||'your startup';
  const onboardingDone=state.onboarding.filter(item=>item.status==='Done').length;
  const onboardingPct=state.onboarding.length?Math.round(onboardingDone/state.onboarding.length*100):0;
  const blockedOnboarding=state.onboarding.filter(item=>item.status!=='Done'&&item.dependsOn&&state.onboarding.some(parent=>String(parent.id)===String(item.dependsOn)&&parent.status!=='Done')).length;
  const setupDone=Boolean(settings.setupCompleted);

  const teamPendingLeaves=state.leaves.filter(l=>l.status==='Pending'&&directReportNames.has(l.employee));

      <div class="card metric"><strong>${teamPendingExpenses.length}</strong><span>Team expense claims to review</span></div>
      <div class="card metric"><strong>${state.onboarding.filter(x=>x.status!=='Done'&&teamEmployees.some(e=>String(x.owner||'').toLowerCase().includes(String(e.name||'').toLowerCase()))).length}</strong><span>Team onboarding tasks open</span></div>
    </div>`;
  } else if(role==='employee'){
    metrics=`<div class="metrics">
      <div class="card metric"><strong>${ownLeaves.filter(l=>l.status==='Pending').length}</strong><span>My leave requests pending</span></div>
      <div class="card metric"><strong>${ownLeaves.filter(l=>l.status==='Approved').reduce((n,l)=>n+Math.max(0,Number(l.days)||0),0)}</strong><span>Approved leave days</span></div>
      <div class="card metric"><strong>${ownExpenses.filter(r=>r.status==='Pending').length}</strong><span>My expense claims pending</span></div>
      <div class="card metric"><strong>${ownOnboarding.filter(x=>x.status!=='Done').length}</strong><span>My onboarding tasks left</span></div>
      <div class="card metric"><strong>${ownCareerPlan?escapeHTML(ownCareerPlan.progress||'Started'):'Not set up'}</strong><span>My career plan</span></div>
    </div>`;

      </div><div class="charter-insight"><strong>✦ Saarthi’s reflection</strong><p>${escapeHTML(founderCharterInsight(state.companySettings?.charter || {}))}</p></div>

        <div class="pulse-row"><span class="pulse-icon pulse-green">✓</span><span><strong>${onboardingPct}% sample progress</strong><small>Onboarding checklist completed</small></span><div class="mini-progress"><span style="width:${onboardingPct}%"></span></div></div>

      <button class="card founder-quick-card" data-founder-action="leaves"><span class="quick-symbol quick-lilac">◷</span><strong>Leave approvals</strong><small>Review requests and team absences</small><span class="quick-arrow">↗</span></button>
      <button class="card founder-quick-card" data-founder-action="reimbursements"><span class="quick-symbol quick-green">₹</span><strong>Expense claims</strong><small>Review reimbursements and spend</small><span class="quick-arrow">↗</span></button>
      <button class="card founder-quick-card" data-founder-action="playbook"><span class="quick-symbol quick-amber">✦</span><strong>Founder playbook</strong><small>Practical people-ops guidance</small><span class="quick-arrow">↗</span></button>

function renderLeaves(el,role){
  const canApprove=['founder','hr','manager'].includes(role);
  const managerTeam=role==='manager'?state.employees.filter(e=>String(e.manager||'').trim().toLowerCase()===String(state.displayName||'').trim().toLowerCase()&&String(e.status||'Active').toLowerCase()==='active'):[];
  const managerNames=new Set(managerTeam.map(e=>e.name));
  const managerLeaves=state.leaves.filter(l=>managerNames.has(l.employee));
  const firstPending=managerLeaves.find(l=>l.status==='Pending');
  const nextRelevantLeave=managerLeaves.find(l=>l.status==='Approved'&&String(l.date||'')>=localISODate());
  const impactDefault=state.teamLeaveImpactDate||firstPending?.date||nextRelevantLeave?.date||localISODate();
  el.innerHTML=pageHead(role==='employee'?'My leave requests':'Leave management','Apply and review. India-aware types noted.',`<button class="primary" id="applyLeave">+ Apply leave</button>`)+
  (role==='manager'?`<section class="card" id="teamLeaveInsights" style="margin-bottom:16px"><div class="section-head"><div><h3>Team availability & workload</h3><p class="muted">Use this context before approving a request. Absence counts use approved leave; pending requests are shown separately.</p></div><label for="teamImpactDate">Check date</label><input id="teamImpactDate" type="date" value="${escapeHTML(impactDefault)}" style="max-width:180px"></div><div id="teamLeaveInsightBody" class="grid-cards"></div><div class="tiny muted" style="margin-top:10px">Use this view to plan cover and protect commitments—not to score performance or judge leave-taking. Work context is incomplete when owners or dependencies are missing. Pending leave is a proposed absence, not confirmed.</div></section>`:'')+
  `<div class="filter-bar"><input id="leaveFilter" placeholder="Filter employee, type, reason or status..."></div>
  <div class="card table-card"><div class="table-wrap"><table id="leaveTable"><thead><tr><th>Employee</th><th>Type</th><th>Days</th><th>Date</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></div></div>`;
  function drawTeamInsights(){
    if(role!=='manager')return;
    const date=$('teamImpactDate').value||localISODate();
    const year=String(date||localISODate()).slice(0,4);
    // Compare calendar dates in local time; ISO UTC conversion can shift the day in some time zones.
    const leaveEndDate=l=>{const start=new Date((l.date||'')+'T12:00:00');if(Number.isNaN(start.getTime()))return '';start.setDate(start.getDate()+Math.max(1,Number(l.days)||1)-1);return `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;};
    const overlapsDate=l=>{const start=String(l.date||'');const end=leaveEndDate(l);return Boolean(start&&end&&start<=date&&end>=date);};
    const leaveDaysInYear=(l,y)=>{const start=String(l.date||'');const end=leaveEndDate(l);if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(start)||!end)return 0;const first=start>y+'-01-01'?start:y+'-01-01';const last=end<y+'-12-31'?end:y+'-12-31';if(first>last)return 0;const utc=d=>{const [yy,mm,dd]=d.split('-').map(Number);return Date.UTC(yy,mm-1,dd)};return Math.round((utc(last)-utc(first))/86400000)+1;};
    const approvedOnDate=managerLeaves.filter(l=>l.status==='Approved'&&overlapsDate(l));
    const pendingOnDate=managerLeaves.filter(l=>l.status==='Pending'&&overlapsDate(l));
    const takenByMember=managerTeam.map(e=>({employee:e,days:managerLeaves.filter(l=>l.employee===e.name&&l.status==='Approved').reduce((n,l)=>n+leaveDaysInYear(l,String(year)),0),pending:managerLeaves.filter(l=>l.employee===e.name&&l.status==='Pending').length,away:approvedOnDate.some(l=>l.employee===e.name)}));
    const available=Math.max(0,managerTeam.length-new Set(approvedOnDate.map(l=>l.employee)).size);
    const allProjects=state.projects||[];
    const allOnboarding=state.onboarding||[];
    const deliveryContextFor=member=>{
      const name=String(member||'').trim().toLowerCase();
      const ownedProjects=allProjects.filter(p=>String(p.owner||'').trim().toLowerCase()===name);
      const ownedSteps=allOnboarding.filter(x=>String(x.owner||'').trim().toLowerCase()===name);
      const completedProjects=ownedProjects.filter(p=>['completed','done'].includes(String(p.status||'').trim().toLowerCase())).length;
      const atRiskProjects=ownedProjects.filter(p=>['at risk','blocked','overdue'].includes(String(p.status||'').trim().toLowerCase())).length;
      const completedSteps=ownedSteps.filter(x=>String(x.status||'').trim().toLowerCase()==='done').length;
      const hasEvidence=ownedProjects.length+ownedSteps.length>0;
      const summary=!hasEvidence?'No linked work data available':[ownedProjects.length?completedProjects+'/'+ownedProjects.length+' projects complete':null,ownedSteps.length?completedSteps+'/'+ownedSteps.length+' onboarding steps complete':null,atRiskProjects?atRiskProjects+' project(s) need a separate review':null].filter(Boolean).join(' · ');
      return {summary,hasEvidence,atRiskProjects};
    };
    const activeOnboarding=allOnboarding.filter(item=>item.status!=='Done');
    const activeProjects=allProjects.filter(p=>!['completed','done'].includes(String(p.status||'').toLowerCase()));
    const workItems=managerTeam.flatMap(member=>{
      const approved=managerLeaves.some(l=>l.employee===member.name&&l.status==='Approved'&&overlapsDate(l));
      const pending=managerLeaves.some(l=>l.employee===member.name&&l.status==='Pending'&&overlapsDate(l));
      const impact=approved?'Cover needed':pending?'Review cover plan':'No leave overlap';
      return [...activeOnboarding.filter(x=>String(x.owner||'').toLowerCase().includes(member.name.toLowerCase())).map(x=>({member:member.name,title:x.title,source:'Onboarding',due:x.dueDate||'Not set',status:x.status||'Not started',impact})),...activeProjects.filter(x=>String(x.owner||'').toLowerCase()===member.name.toLowerCase()).map(x=>({member:member.name,title:x.name,source:'Project',due:x.due||'Not set',status:x.status||'On track',impact}))];
    });
    const urgentWork=workItems.filter(x=>x.impact!=='No leave overlap').length;
    const openWorkFor=member=>workItems.filter(x=>x.member===member).length;

at may need reassignment</strong><p class="muted tiny">Named direct-report owners only; team-owned work without a named person is not included.</p><div class="table-wrap"><table><thead><tr><th>Owner</th><th>Work item</th><th>Type</th><th>Due</th><th>State</th><th>Leave impact</th></tr></thead><tbody>${workItems.map(x=>`<tr><td>${escapeHTML(x.member)}</td><td>${escapeHTML(x.title)}</td><td>${escapeHTML(x.source)}</td><td>${escapeHTML(x.due)}</td><td>${escapeHTML(x.status)}</td><td><span class="pill ${x.impact==='Cover needed'?'pending':x.impact==='Review cover plan'?'open':'approved'}">${escapeHTML(x.impact)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No named work items found. Assign individual owners to onboarding steps or projects to see cover suggestions.</td></tr>'}</tbody></table></div></div>`;
  }
  function draw(){const q=($('leaveFilter').value||'').toLowerCase();let rows=state.leaves;if(role==='employee')rows=rows.filter(l=>l.employee===state.displayName);if(role==='manager')rows=rows.filter(l=>managerNames.has(l.employee));rows=rows.filter(l=>!q||String(l.employee||'').toLowerCase().includes(q)||String(l.type||'').toLowerCase().includes(q)||String(l.reason||'').toLowerCase().includes(q)||String(l.status||'').toLowerCase().includes(q));$('leaveTable').querySelector('tbody').innerHTML=rows.map(l=>`<tr><td><strong>${escapeHTML(l.employee)}</strong></td><td>${escapeHTML(l.type)}</td><td>${l.days}</td><td><time datetime="${escapeHTML(l.date||'')}" title="${escapeHTML(l.date||'') }">${escapeHTML(l.date||'—')}</time>${l.requestedAt?`<div class="tiny muted">Requested ${escapeHTML(new Date(l.requestedAt).toLocaleDateString())}</div>`:''}</td><td>${escapeHTML(l.reason)}</td><td><span class="pill ${String(l.status||'Pending').toLowerCase()}">${escapeHTML(l.status||'Pending')}${l.approver?' · '+escapeHTML(l.approver):''}</span>${l.reviewedAt?`<div class="tiny muted">Reviewed ${escapeHTML(new Date(l.reviewedAt).toLocaleDateString())}</div>`:''}</td><td>${l.status==='Pending'&&canApprove?`<div class="actions"><button class="success small" data-approve="${l.id}">Approve</button><button class="danger small" data-reject="${l.id}">Reject</button></div>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No requests yet. Apply for leave to see your request here.</td></tr>'}
  draw();if(role==='manager'){$('teamImpactDate').addEventListener('input',()=>{state.teamLeaveImpactDate=$('teamImpactDate').value;saveState();drawTeamInsights()});drawTeamInsights()}$('leaveFilter').addEventListener('input',draw);
  $('applyLeave').addEventListener('click',()=>openForm('Apply for leave',[
    {name:'type',label:'Leave type',type:'select',options:['Casual Leave','Sick Leave','Earned Leave','Unpaid Leave','Maternity (note: confirm eligibility)','Paternity'],required:true},
    {name:'days',label:'Number of days',type:'number',min:1,required:true,value:'1'},
    {name:'date',label:'Start date',type:'date',required:true,min:localISODate(),value:localISODate(1)},
    {name:'reason',label:'Reason',type:'textarea',required:true}
  ],v=>{
    const reason=String(v.reason||'').trim();
    if(v.date<localISODate()){notify('Choose today or a future start date.');return false}

  }));

}

function localISODate(offsetDays=0){
  const date=new Date();
  date.setHours(12,0,0,0);
  date.setDate(date.getDate()+offsetDays);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}

function openForm(title,fields,onSubmit){

  bg.classList.remove('hidden');

}

  const roleLabels={founder:'Founder',hr:'People Ops',manager:'Manager',employee:'Employee',candidate:'Candidate'};
  const roleLabel=roleLabels[state.activeRole]||'Team member';
  const prompts=state.activeRole==='founder'
    ?['What needs my attention today?','Help me plan a hiring request','How should I review people costs?']

      ?['Help me plan onboarding','Where can I check a policy?','What should a good hiring brief include?']

          ?['How can I prepare for an interview?','How do I request an adjustment?','What should I ask the recruiter?']
          :['How do I apply for leave?','Where can I check a policy?','How do I submit an expense?'];
  c.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3 style="margin:0 0 4px">Ask Saarthi</h3><p class="muted tiny" style="margin:0">Your People OS companion · ${roleLabel} view</p></div><span class="pill open">Prototype</span></div><div class="card" style="margin:12px 0;padding:10px;background:var(--surface,#f8fafc)"><strong style="font-size:12px">A helpful first step</strong><p class="muted tiny" style="margin:4px 0 0">Ask a question to get guided to the right workflow. You stay in control of the next action.</p></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px" id="aiPromptChips">${prompts.map((p,i)=>'<button type="button" class="secondary small" data-ai-prompt="'+i+'">'+escapeHTML(p)+'</button>').join('')}</div><div class="chat-box" id="chatBox"><div class="bubble bot">Hi! I can help you find the right Saarthi workflow, understand general people processes, or prepare questions for your People team. What would make your day easier?</div></div><div style="display:flex;gap:6px"><input id="chatInput" aria-label="Ask Saarthi a question" placeholder="Ask a question..." style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px"><button class="primary small" id="chatSend">Send</button></div><p class="muted tiny" style="margin:8px 0 0">Prototype guidance only — this assistant is not connected to a live AI service or company records. Verify policy, eligibility and employment decisions with the appropriate person.</p><div style="text-align:right;margin-top:8px"><button class="neutral small" id="aiClose">Close</button></div>`;
  bg.classList.remove('hidden');
  function addBubble(kind,text){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=text;$('chatBox').appendChild(b);$('chatBox').scrollTop=$('chatBox').scrollHeight}
  function reply(q){
    const lower=q.toLowerCase();

    if(lower.includes('attention')||lower.includes('today'))answer=state.activeRole==='founder'?'Start with your executive dashboard, open decisions and people budget. Review any hiring request against the approved plan before committing spend.':'Start with your role dashboard, then review pending actions and due dates. This prototype does not have live company activity.';
    else if(lower.includes('hiring')||lower.includes('requisition')||lower.includes('role brief'))answer=['founder','hr'].includes(state.activeRole)?'Open Resource Requisitions to review the hiring need. Capture the role purpose, outcomes, must-have skills, budget owner and interview plan. The AI recruitment brief is a planned backend feature and is not live in this prototype.':'Ask your manager or People Ops to clarify the role purpose, outcomes, must-have skills and approval path before recruitment begins.';
    else if(lower.includes('cost')||lower.includes('budget')||lower.includes('expense')||lower.includes('reimburse')||lower.includes('claim'))answer=state.activeRole==='founder'?'Open People Budget to review planned people costs and assumptions. Treat the sample figures as demo data, not actual company finances.': 'Open Reimbursements for the demo workflow, or ask your manager/People Ops about the current approval path. Any figures shown here are sample data.';
    else if(lower.includes('policy')||lower.includes('compliance')||lower.includes('posh')||lower.includes('pf')){const approved=(state.policyDocuments||[]).filter(d=>d.status==='Published');answer=approved.length?'This demo contains '+approved.length+' published policy item(s). Open Policy Documents and check the approved wording and effective date. If it does not answer your situation, ask HR.':'I can’t find a published policy in this demo to support a reliable answer. Ask People Ops for the current approved policy; don’t rely on an unreviewed draft for a decision.';}
    else if(lower.includes('leave'))answer=state.activeRole==='manager'?'Open Leave Management and review the team’s availability and workload before deciding. Consider coverage, overlapping leave and urgent deliverables, then apply your organisation’s approved policy.':'Open Leave Management and choose Apply Leave. This is a demo workflow; confirm eligibility and the current rule in your organisation’s approved policy.';
    else if(lower.includes('onboard'))answer='Open Onboarding Engine to review the sample checklist. A real onboarding workflow should assign an owner and due date to each task and track completion after authentication is connected.';
    else if(lower.includes('interview')||lower.includes('candidate')||lower.includes('adjustment'))answer='For interviews, focus on role-related evidence and consistent questions. Candidates should be able to request an adjustment privately. Hiring decisions must remain with accountable people; this prototype does not assess or rank candidates.';
    else if(lower.includes('feedback')||lower.includes('workload')||lower.includes('team'))answer='Open the team and project views to prepare a workload conversation. Use current assignments, availability and agreed outcomes; avoid drawing conclusions from incomplete or sample data.';
    addBubble('bot',answer);
  }
  $('chatSend').onclick=()=>{const q=$('chatInput').value.trim();if(!q)return;addBubble('user',q);$('chatInput').value='';reply(q)};
  $('chatInput').onkeydown=e=>{if(e.key==='Enter')$('chatSend').click()};
  c.querySelectorAll('[data-ai-prompt]').forEach(button=>button.addEventListener('click',()=>{const prompt=prompts[Number(button.dataset.aiPrompt)];$('chatInput').value=prompt;$('chatInput').focus()}));
  $('aiClose').onclick=()=>bg.classList.add('hidden');
  $('chatInput').focus();
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++;}
    else if(ch==='"')quoted=!quoted;
    else if(ch===','&&!quoted){row.push(cell.trim());cell='';}
    else if((ch==='\n'||ch==='\r')&&!quoted){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cell.trim());cell='';
      if(row.some(value=>value!==''))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell.trim());if(row.some(value=>value!==''))rows.push(row);}
  if(quoted)throw new Error('CSV has an unclosed quoted field.');
  if(rows.length<2)throw new Error('CSV needs a header row and at least one employee row.');
  const headers=rows.shift().map(value=>value.replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[ _-]+/g,''));
  const column=name=>headers.indexOf(name);
  const nameCol=column('name'),roleCol=column('role');
  if(nameCol<0||roleCol<0)throw new Error('CSV must include Name and Role columns.');
  const get=(r,key,fallback='')=>{const index=column(key);return index<0?'':String(r[index]||'').trim()||fallback;};
  const employees=rows.map((r,i)=>({
    id:Math.max(0,...state.employees.map(e=>Number(e.id)||0))+i+1,
    name:String(r[nameCol]||'').trim(),
    role:String(r[roleCol]||'').trim(),
    location:get(r,'location','Remote'),
    join:get(r,'join',get(r,'joindate',new Date().toISOString().slice(0,10))),
    manager:get(r,'manager','Unassigned'),
    status:get(r,'status','Active')
  })).filter(e=>e.name&&e.role);
  if(!employees.length)throw new Error('No valid employee rows found. Each row needs Name and Role.');
  return employees;
}
$('importEmployeesFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    if(file.size>1024*1024)throw new Error('Employee CSV must be 1 MB or smaller.');
    const parsedEmployees=parseCSV(await file.text());
    const employeeKey=employee=>String(employee.name||'').trim().toLocaleLowerCase()+'|'+String(employee.role||'').trim().toLocaleLowerCase();
    const knownEmployees=new Set(state.employees.map(employeeKey));
    const imported=[];
    let duplicates=0;
    parsedEmployees.forEach(employee=>{
      const key=employeeKey(employee);
      if(knownEmployees.has(key)){duplicates++;return;}
      knownEmployees.add(key);
      imported.push(employee);
    });
    if(!imported.length)throw new Error('No new employees to import. All valid rows already exist in your directory.');
    state.employees.push(...imported);
    if(state.activeRole==='founder')markSetupStep('teamImported');
    saveState();renderApp();
    const duplicateNote=duplicates?' Skipped '+duplicates+' duplicate row'+(duplicates===1?'':'s')+'.':'';
    notify('Imported '+imported.length+' employee'+(imported.length===1?'':'s')+'.'+duplicateNote);
    if(['founder','hr'].includes(state.activeRole)){
      currentTab='directory';renderApp();
    }
  }catch(err){notify(err.message||'Could not import employee CSV.');}
  finally{e.target.value='';}
});
$('importDataFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    if(!window.confirm('Importing a backup replaces the current demo data in this browser. Export a backup first if you want to keep the current data. Continue?'))return;
    if(file.size>2*1024*1024)throw new Error('Backup must be 2 MB or smaller.');
    const parsed=JSON.parse(await file.text());
    const incoming=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;
    const arrays=['employees','leaves','reimbursements','shoutouts','tickets','onboarding'];
    if(!incoming||!arrays.every(k=>Array.isArray(incoming[k])))throw new Error('This file is not a valid Saarthi backup. Required data sections are missing.');
    if(incoming.activeRole&&!roles[incoming.activeRole])throw new Error('The backup contains an unsupported role.');
    const restored={...clone(seedData),...incoming};
    arrays.forEach(k=>{if(!Array.isArray(restored[k]))throw new Error('Invalid '+k+' section.')});
    state=restored;
    saveState();
    $('roleSelector').value=roles[state.activeRole]?state.activeRole:'founder';
    currentTab=roles[state.activeRole]?roles[state.activeRole].nav[0][0]:'dashboard';
    renderApp();
    notify('Backup restored successfully.');
  }catch(err){notify(err.message||'Could not restore this backup.');}
  finally{e.target.value='';}
});
$('logoutBtn').addEventListener('click',()=>{$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('demoCode').value=''});
$('menuToggle').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open));$('menuToggle').setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sidebar').classList.contains('open')){$('sidebar').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false');$('menuToggle').setAttribute('aria-label','Open navigation menu');$('menuToggle').focus()}});
document.addEventListener('click',e=>{if(e.target.id==='modalBg')$('modalBg').classList.add('hidden')});
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
