/* Saarthi visual refresh: calmer surfaces, clearer hierarchy, responsive polish */
:root{
  --navy:#111827;--ink:#182338;--muted:#68758a;--line:#e5eaf2;--bg:#f4f6fb;
  --indigo:#4f46e5;--purple:#8b5cf6;--green:#0f9f78;--amber:#b7791f;--red:#dc4545;
  --surface:#ffffff;--soft-indigo:#eef2ff;--shadow-sm:0 2px 8px rgba(20,32,58,.045);
  --shadow-md:0 12px 32px rgba(20,32,58,.075);
}
body{background:radial-gradient(ellipse at 8% 0%,rgba(99,102,241,.07),transparent 32%),var(--bg);color:var(--ink);letter-spacing:-.01em}
button{border-radius:11px;min-height:36px}
button:active{transform:translateY(1px)}
.primary{background:linear-gradient(135deg,#5145e5,#6d4de6);box-shadow:0 4px 10px rgba(79,70,229,.16)}
.primary:hover{background:linear-gradient(135deg,#4338ca,#5b21b6);box-shadow:0 6px 16px rgba(79,70,229,.22);transform:translateY(-1px)}
.secondary{background:#eef2ff;color:#4338ca}
.neutral{background:#f1f4f9;color:#344256}
.neutral:hover{background:#e8edf5}
.topbar{background:linear-gradient(110deg,#111827 0%,#18213a 70%,#29245a 100%);padding:13px clamp(14px,2.4vw,30px);box-shadow:0 5px 22px rgba(15,23,42,.16);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{letter-spacing:-.035em;font-size:20px}
.logo{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(79,70,229,.28)}
.layout{max-width:1440px;padding:26px clamp(12px,2.5vw,32px);gap:22px}
.sidebar,.panel,.card{border-color:#e6eaf2;box-shadow:var(--shadow-sm)}
.sidebar{padding:13px;border-radius:18px;background:rgba(255,255,255,.94)}
.nav{gap:5px}
.nav button{padding:10px 11px;font-size:13px;transition:background .15s,color .15s,transform .15s}
.nav button.active{background:linear-gradient(100deg,#eef2ff,#f4f0ff);color:#4338ca;box-shadow:inset 3px 0 0 #635bdf;font-weight:750}
.nav button:hover{transform:translateX(2px)}
.sidebar .summary{background:linear-gradient(135deg,#f8fafc,#f3f4ff);border:1px solid #edf0f8;line-height:1.65}
.section-title{font-size:20px;letter-spacing:-.035em;color:#17213a}
.page-head{align-items:center;margin-bottom:20px}
.metrics{gap:14px;margin-bottom:20px}
.metric{position:relative;overflow:hidden;padding:17px 18px;border-radius:16px;background:linear-gradient(145deg,#fff,#fbfcff);transition:transform .18s,box-shadow .18s}
.metric:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.metric:after{content:"";position:absolute;right:-22px;top:-28px;width:84px;height:84px;border-radius:50%;background:rgba(99,102,241,.055)}
.metric strong{font-size:27px;letter-spacing:-.045em;line-height:1.25;color:#17213a}
.metric span{display:inline-block;margin-top:5px;line-height:1.4}
.card{padding:18px 20px;border-radius:17px}
.table-card{padding:0}
th{padding:12px 15px;background:#f7f8fc;color:#69758b;font-size:10px;letter-spacing:.075em}
td{padding:12px 15px}
tr:hover td{background:#f8f9ff}
.pill{padding:4px 10px;letter-spacing:.01em}
.progress{height:9px;background:#edf0f6}
.onboard-step{padding:14px 2px}
.modal-bg{backdrop-filter:blur(5px);background:rgba(15,23,42,.58)}
.modal{border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:24px;box-shadow:0 28px 70px rgba(15,23,42,.28)}
.modal h3{letter-spacing:-.03em}
.form-row{margin-bottom:15px}
.form-row label{color:#344256;font-size:12px;margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea,.filter-bar input{padding:10px 12px;border-color:#dfe5ef;border-radius:10px;transition:border-color .15s,box-shadow .15s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus,.filter-bar input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.1);outline:none}
.chat-box{background:#f6f7fc;border:1px solid #eceffa}
.bubble{padding:10px 13px;border-radius:14px;line-height:1.55}
.bot{background:#eef2ff;color:#38318b}
.toast{border:1px solid #374151;box-shadow:0 12px 32px rgba(15,23,42,.22)}
#loginScreen{background:radial-gradient(ellipse at 18% 15%,rgba(129,140,248,.2),transparent 35%),radial-gradient(ellipse at 85% 85%,rgba(167,139,250,.18),transparent 32%),linear-gradient(135deg,#f7f8ff,#f5f7fb 52%,#f0edff)}
#loginScreen>.card{padding:30px;border-radius:24px;border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(38,48,85,.12);backdrop-filter:blur(12px)}
#loginScreen .brand{font-size:23px}
#loginScreen h2{font-size:25px;letter-spacing:-.045em;color:#17213a}
#loginScreen form button{width:100%;margin-top:4px}
@media(max-width:900px){
  .layout{padding:14px;gap:14px}
  .sidebar{box-shadow:var(--shadow-md)}
  .page-head{align-items:flex-start}
  .top-actions{gap:6px;flex-wrap:wrap;justify-content:flex-end}
}
@media(max-width:560px){
  .topbar{gap:8px;align-items:flex-start}
  .brand{font-size:17px;gap:7px}
  .brand small{font-size:9px;margin-left:2px}
  .logo{width:34px;height:34px}
  .top-actions{max-width:58%;font-size:12px}
  .top-actions select{max-width:145px;padding:7px;font-size:12px}
  .layout{padding:10px}
  .metrics{gap:9px}
  .metric{padding:13px;border-radius:14px}
  .metric strong{font-size:23px}
  .card{padding:15px}
  .page-head{gap:8px}
  .section-title{font-size:18px}
  #loginScreen>.card{padding:23px}
  .modal-bg{padding:12px}
  .modal{padding:18px;border-radius:17px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* Founder dashboard: guided, calm, actionable */
.founder-hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:255px;padding:clamp(22px,3.5vw,38px);margin-bottom:18px;border-radius:23px;color:#fff;background:linear-gradient(112deg,#171c3b 0%,#28245b 58%,#4b36a5 100%);box-shadow:0 18px 42px rgba(44,39,108,.18)}
.founder-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 80% 20%,rgba(167,139,250,.25),transparent 28%),radial-gradient(circle at 55% 100%,rgba(99,102,241,.25),transparent 38%)}
.founder-hero-copy{max-width:590px;position:relative;z-index:1}
.founder-kicker{font-size:10px;font-weight:850;letter-spacing:.14em;color:#8177ee;text-transform:uppercase}
.founder-hero .founder-kicker{color:#c4baff}
.founder-hero h2{font-size:clamp(25px,3vw,36px);line-height:1.12;letter-spacing:-.05em;margin:12px 0;color:#fff;max-width:560px}
.founder-hero p{max-width:520px;font-size:13px;line-height:1.8;color:#d6d8f1;margin:0 0 22px}
.founder-hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.founder-hero-actions button{padding:10px 15px}
.hero-primary{background:#fff;color:#332778;box-shadow:0 5px 16px rgba(10,10,35,.16)}
.hero-primary:hover{background:#f2f0ff}
.hero-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.hero-secondary:hover{background:rgba(255,255,255,.18)}
.founder-hero-art{position:relative;flex:0 0 220px;height:200px;display:grid;place-items:center;margin-right:12px}
.orbit{position:absolute;border:1px solid rgba(221,214,254,.23);border-radius:50%;transform:rotate(-25deg)}
.orbit-one{width:190px;height:125px}.orbit-two{width:150px;height:190px;transform:rotate(45deg)}
.orbit-core{width:88px;height:88px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(145deg,#a5b4fc,#8b5cf6);border:1px solid rgba(255,255,255,.4);box-shadow:0 0 0 12px rgba(196,181,253,.08),0 15px 35px rgba(10,10,40,.28);font-size:43px;font-weight:850;color:#fff}
.orbit-chip{position:absolute;padding:7px 10px;border:1px solid rgba(255,255,255,.22);border-radius:11px;background:rgba(27,25,73,.68);backdrop-filter:blur(8px);font-size:10px;font-weight:750;color:#f5f3ff;box-shadow:0 7px 20px rgba(0,0,0,.12)}
.chip-one{top:15px;left:7px}.chip-two{right:-15px;top:63px}.chip-three{bottom:12px;left:26px}
.founder-start-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;margin-bottom:22px}
.founder-setup-card,.founder-insight-card{padding:20px}
.founder-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.founder-section-heading h3,.founder-insight-card h3{margin:4px 0 0;font-size:17px;letter-spacing:-.03em;color:#1b2540}
.setup-count{font-size:11px;font-weight:750;color:#5b50ca;background:#f0efff;padding:5px 9px;border-radius:20px}
.founder-setup-card>.progress{margin-bottom:10px;height:6px}
.founder-task{display:flex;width:100%;align-items:center;gap:11px;padding:13px 0;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid #edf0f6;color:var(--ink)}
.founder-task:last-child{border-bottom:0;padding-bottom:2px}
.founder-task:hover{background:#fafaff}
.task-icon{flex:0 0 31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#f0efff;color:#6557d8;font-size:10px;font-weight:850}
.founder-task>span:nth-child(2){display:grid;gap:3px;flex:1}
.founder-task strong{font-size:12px}
.founder-task small,.pulse-row small,.founder-quick-card small{display:block;font-size:10px;line-height:1.5;color:#7b8497;font-weight:450}
.task-status{white-space:nowrap;font-size:10px;font-weight:800;color:#5b50ca}
.task-complete{color:#0f9f78}
.founder-insight-card h3{margin-bottom:14px}
.pulse-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f6}
.pulse-row:last-of-type{border-bottom:0}
.pulse-row>span:nth-child(2){flex:1;min-width:0}
.pulse-row strong{display:block;font-size:12px}
.pulse-icon{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:10px;font-size:15px;font-weight:800}
.pulse-indigo{background:#eef2ff;color:#4f46e5}.pulse-violet{background:#f3e8ff;color:#7e22ce}.pulse-green{background:#dcfce7;color:#15803d}
.pulse-row button{background:transparent;color:#5b50ca;padding:5px;font-size:10px;white-space:nowrap}
.mini-progress{width:55px;height:6px;border-radius:10px;background:#edf0f6;overflow:hidden}.mini-progress span{display:block;height:100%;background:#8b5cf6;border-radius:10px}
.founder-demo-note{margin:13px 0 0;font-size:9px;line-height:1.6;color:#929bad}
.founder-quick-heading{margin:2px 0 12px}
.founder-quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.founder-quick-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:145px;text-align:left;padding:17px;border-radius:16px;color:var(--ink);transition:transform .16s,box-shadow .16s,border-color .16s}
.founder-quick-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,32,58,.09);border-color:#d7d9ff}
.quick-symbol{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;font-size:18px;font-weight:800}
.quick-blue{background:#eaf1ff;color:#4562d9}.quick-lilac{background:#f1edff;color:#7757cf}.quick-green{background:#e3f8ef;color:#0e8a68}.quick-amber{background:#fff3dc;color:#b7791f}
.founder-quick-card strong{font-size:12px;margin-top:4px}
.founder-quick-card small{padding-right:10px}
.quick-arrow{position:absolute;right:15px;top:15px;color:#9aa3b5;font-size:14px}
@media(max-width:1000px){.founder-hero-art{flex-basis:180px;margin-right:0}.founder-quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.founder-hero{min-height:0;padding:24px;border-radius:19px}.founder-hero-art{display:none}.founder-start-grid{grid-template-columns:1fr;gap:12px}.founder-quick-grid{gap:9px}.founder-quick-card{padding:14px;min-height:135px}.founder-task{gap:8px}.task-status{font-size:9px}}



/* Responsive UI refinement: clearer status semantics and easier mobile navigation */
.pill.resolved{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.pill.pending{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.pill.approved{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.directory-status-metrics .metric{border-top:3px solid #c7d2fe}
.directory-status-metrics .metric:nth-child(1){border-top-color:#34d399}
.directory-status-metrics .metric:nth-child(2){border-top-color:#cbd5e1}
.directory-status-metrics .metric:nth-child(3){border-top-color:#fdba74}
.table-card table{min-width:680px}
button,select,input,textarea{-webkit-tap-highlight-color:transparent}
@media(max-width:560px){
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
  .topbar>.brand{width:100%;min-width:0}
  .top-actions{width:100%;max-width:none;display:flex;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overscroll-behavior-x:contain;padding:2px 0 6px;scrollbar-width:thin}

  .directory-status-metrics .metric span{font-size:11px}

@media(min-width:561px) and (max-width:900px){.top-actions{flex-wrap:wrap;justify-content:flex-end}}

/* Product polish: stronger hierarchy, calmer surfaces, and accessible interactions */
.page-head .section-title{font-size:clamp(19px,2vw,24px);letter-spacing:-.035em;line-height:1.2}
.page-head>div>p{max-width:68ch;margin:7px 0 0;line-height:1.55}
.metrics .metric{position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.metrics .metric:hover{transform:translateY(-2px);box-shadow:0 9px 22px #0f172a0c;border-color:#c7d2fe}
.metric strong{letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.card h3,.panel h3{letter-spacing:-.015em}
.table-card thead th{background:#f8fafc;color:#475569;font-size:11px;font-weight:750;letter-spacing:.035em;text-transform:uppercase}
table td,table th{vertical-align:middle}
input,select,textarea{border-color:#cbd5e1;border-radius:9px}
input:focus,select:focus,textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px #eef2ff}

<script>

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return clone(seedData);
    const parsed=JSON.parse(raw);
    return {...clone(seedData),...parsed,
      employees:Array.isArray(parsed.employees)?parsed.employees:clone(seedData.employees),
      leaves:Array.isArray(parsed.leaves)?parsed.leaves:clone(seedData.leaves),
      reimbursements:Array.isArray(parsed.reimbursements)?parsed.reimbursements:clone(seedData.reimbursements),
      shoutouts:Array.isArray(parsed.shoutouts)?parsed.shoutouts:clone(seedData.shoutouts),
      tickets:Array.isArray(parsed.tickets)?parsed.tickets:clone(seedData.tickets),
      onboarding:Array.isArray(parsed.onboarding)?parsed.onboarding:clone(seedData.onboarding),
      projects:Array.isArray(parsed.projects)?parsed.projects:clone(seedData.projects),
      careerPlans:Array.isArray(parsed.careerPlans)?parsed.careerPlans:clone(seedData.careerPlans),
      careerSettings:{...clone(seedData.careerSettings),...(parsed.careerSettings||{}),skillAreas:Array.isArray(parsed.careerSettings?.skillAreas)?parsed.careerSettings.skillAreas:clone(seedData.careerSettings.skillAreas),goalHorizons:Array.isArray(parsed.careerSettings?.goalHorizons)?parsed.careerSettings.goalHorizons:clone(seedData.careerSettings.goalHorizons)},
      workflowSettings:{...clone(seedData.workflowSettings),...(parsed.workflowSettings||{})},
      accessConfig:parsed.accessConfig||{}
    };
  }catch(e){console.warn(e);return clone(seedData)}
}
let storageWarningShown=false;
function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}
  catch(e){
    console.warn('Saarthi could not persist this session in browser storage.',e);
    if(!storageWarningShown){storageWarningShown=true;notify('Browser storage is unavailable. The demo will work, but changes may not survive a refresh.');}
  }
}
let state=loadState(), currentTab='dashboard', toastTimer;
const $=id=>document.getElementById(id);
const roles={
  founder:{badge:'FOUNDER / ADMIN',nav:[['dashboard','Executive Dashboard','▦'],['career','Career & Learning','🌱'],['projects','Project & OKR Tracking','🎯'],['playbook','Founders’ Playbook','📘'],['directory','Team Directory','👥'],['rewards','Rewards & Culture','🏆'],['leaves','Leave Approvals','📅'],['reimbursements','Expense Claims','₹'],['helpdesk','Support Helpdesk','🎧'],['admin_settings','Advanced Settings','⚙']]},
  hr:{badge:'PEOPLE OPS / HR',nav:[['dashboard','People Ops Hub','♙'],['career','Career & Learning','🌱'],['projects','Project & OKR Tracking','🎯'],['playbook','Founders’ Playbook','📘'],['directory','Team Directory','👥'],['onboarding','Onboarding Engine','🚀'],['leaves','Leave Management','📅'],['reimbursements','Reimbursements','₹'],['helpdesk','Helpdesk Tickets','🎧'],['rewards','Rewards & Culture','🏆']]},
  manager:{badge:'TEAM MANAGER',nav:[['dashboard','Team Dashboard','▦'],['career','Career & Learning','🌱'],['projects','Project & OKR Tracking','🎯'],['leaves','Team Leave Requests','📅'],['reimbursements','Expense Approvals','₹'],['rewards','Give Shoutout','🏆'],['helpdesk','Helpdesk Tickets','🎧']]},
  employee:{badge:'EMPLOYEE SELF-SERVICE',nav:[['dashboard','My Workspace','⌂'],['career','My Career & Learning','🌱'],['projects','My Projects & OKRs','🎯'],['leaves','My Leaves','📅'],['reimbursements','My Expense Claims','₹'],['rewards','Recognition Wall','🏆'],['helpdesk','HR Helpdesk','?'],['onboarding','My Onboarding','🚀']]},
  candidate:{badge:'CANDIDATE PORTAL',nav:[['candidate_portal','Application Status','✎'],['helpdesk','Candidate Support','🎧']]}
};
function notify(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,2400)}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function pageHead(title,sub,extra=''){return `<div class="page-head module-page-head"><div class="module-heading-copy"><div class="module-kicker"><span class="module-kicker-dot"></span> SAARTHI WORKSPACE</div><h2 class="section-title">${title}</h2><p class="muted tiny">${sub}</p></div>${extra?`<div class="module-heading-actions">${extra}</div>`:''}</div>`}

function openWorkspaceSetup(){
  const settings=state.companySettings||{};
  $('modalContent').innerHTML=`
    <div class="page-head"><div><h2 class="section-title">Set up your workspace</h2><p class="muted tiny">A few details help tailor Saarthi to your startup.</p></div><button type="button" class="neutral small" id="workspaceSetupClose" aria-label="Close setup">Close</button></div>
    <form id="workspaceSetupForm">
      <div class="form-row"><label for="workspaceCompany">Company / startup name</label><input id="workspaceCompany" name="company" maxlength="100" placeholder="e.g. Acme Labs" value="${escapeHTML(settings.name||'')}" required></div>
      <div class="form-row"><label for="workspaceIndustry">Industry</label><select id="workspaceIndustry" name="industry"><option value="">Choose industry</option>${['Technology / SaaS','Fintech','Consumer / E-commerce','Healthcare','Professional services','Other'].map(v=>`<option value="${v}" ${settings.industry===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="form-row"><label for="workspaceLocation">Primary location</label><input id="workspaceLocation" name="location" maxlength="100" placeholder="e.g. Bengaluru, India" value="${escapeHTML(settings.location||'')}"></div>

      <div class="form-row"><label for="workspaceStage">Company stage</label><select id="workspaceStage" name="stage"><option value="">Choose stage</option>${['Idea / pre-launch','Bootstrapped','Pre-seed','Seed','Series A or later'].map(v=>`<option value="${v}" ${settings.stage===v?'selected':''}>${v}</option>`).join('')}</select></div>

      industry:$('workspaceIndustry').value,
      location:$('workspaceLocation').value.trim(),
      teamSize:$('workspaceSize').value,

function markSetupStep(step){
  state.companySettings=state.companySettings||{};
  state.companySettings.setupProgress=state.companySettings.setupProgress||{};
  if(state.companySettings.setupProgress[step])return false;
  state.companySettings.setupProgress[step]=true;
  saveState();
  return true;
}
function renderApp(){
  const role=state.activeRole;
  const r=roles[role];
  $('greeting').textContent=`Hi, ${escapeHTML(state.displayName)}`;
  $('roleSelector').innerHTML=Object.keys(roles).map(k=>`<option value="${k}" ${k===role?'selected':''}>${roles[k].badge}</option>`).join('');
  const roleNav=r.nav.filter(([id])=>id==='admin_settings'||(state.accessConfig?.[role]?.[id]!==false));
  const extraModules=[['career','Career & Learning','🌱'],['projects','Project & OKR Tracking','🎯'],['playbook','Founders’ Playbook','📘'],['directory','Team Directory','👥'],['onboarding','Onboarding','🚀'],['leaves','Leave management','📅'],['reimbursements','Expenses','₹'],['rewards','Rewards & culture','🏆'],['helpdesk','Helpdesk','🎧']];
  if(role!=='candidate')extraModules.forEach(item=>{if(state.accessConfig?.[role]?.[item[0]]===true&&!roleNav.some(existing=>existing[0]===item[0]))roleNav.push(item)});
  if(!roleNav.some(([id])=>id===currentTab))currentTab=roleNav[0]?.[0]||'dashboard';
  $('nav').innerHTML=roleNav.map(([id,label,icon])=>`<button class="${id===currentTab?'active':''}" data-tab="${id}">${icon} ${label}</button>`).join('');
  const canImportEmployees=['founder','hr'].includes(role);
  $('importEmployeesBtn').classList.toggle('hidden',!canImportEmployees);
  $('importEmployeesFile').classList.add('hidden');
  $('workspaceSetupBtn').classList.toggle('hidden',role==='candidate');
  $('exportDataBtn').classList.toggle('hidden',!['founder','hr'].includes(role));
  $('importDataBtn').classList.toggle('hidden',role!=='founder');
  $('resetDemoBtn').classList.toggle('hidden',role!=='founder');
  $('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;renderApp();if(window.innerWidth<900)$('sidebar').classList.remove('open')}));
  const activeHeadcount=state.employees.filter(e=>String(e.status||'Active').trim().toLowerCase()==='active').length;
  const pendingL=state.leaves.filter(l=>l.status==='Pending').length;
  const pendingR=state.reimbursements.filter(r=>r.status==='Pending').length;
  $('sidebarSummary').innerHTML=`<div><strong>${activeHeadcount}</strong> active headcount</div><div class="tiny muted" style="margin-top:4px">${pendingL} leave · ${pendingR} expense pending</div>`;
  const el=$('mainContent');
  if(currentTab==='dashboard') renderDashboard(el,role);
  else if(currentTab==='projects') renderProjects(el,role);
  else if(currentTab==='career') renderCareer(el,role);
  else if(currentTab==='admin_settings') renderAdminSettings(el);
  else if(currentTab==='playbook') renderPlaybook(el);
  else if(currentTab==='directory'){if(role==='founder')markSetupStep('directoryReviewed');renderDirectory(el);}
  else if(currentTab==='onboarding') renderOnboarding(el);
  else if(currentTab==='leaves') renderLeaves(el,role);
  else if(currentTab==='reimbursements') renderReimbursements(el,role);
  else if(currentTab==='rewards') renderRewards(el,role);
  else if(currentTab==='helpdesk') renderHelpdesk(el,role);
  else if(currentTab==='candidate_portal') renderCandidate(el);
}



function renderCareer(el,role){
 const name=String(state.displayName||'').trim(),isEmployee=role==='employee',canCustomize=['founder','hr'].includes(role);
 const plans=state.careerPlans||(state.careerPlans=[]),settings=state.careerSettings||(state.careerSettings=clone(seedData.careerSettings));

  }

function renderOnboarding(el){
  const canManage=['founder','hr'].includes(state.activeRole);
  const today=localISODate();
  const steps=state.onboarding||(state.onboarding=[]);
  const byId=id=>steps.find(x=>String(x.id)===String(id));
  const prerequisite=s=>s.dependsOn?byId(s.dependsOn):null;
  const blockedBy=s=>{if(!s||s.status==='Done')return null;const p=prerequisite(s);return p&&p.status!=='Done'?p:null};
  const blockerChain=s=>{const chain=[];const seen=new Set();let cursor=s;while(cursor&&cursor.status!=='Done'&&cursor.dependsOn&&!seen.has(String(cursor.id))){seen.add(String(cursor.id));const p=byId(cursor.dependsOn);if(!p||p.status==='Done')break;chain.push(p);cursor=p;}return chain;};
  const done=steps.filter(s=>s.status==='Done').length;
  const blocked=steps.filter(s=>s.status!=='Done'&&blockedBy(s)).length;
  const pct=steps.length?Math.round((done/steps.length)*100):0;
  const overdue=s=>s.status!=='Done'&&!blockedBy(s)&&s.dueDate&&s.dueDate<today;
  el.innerHTML=pageHead('Onboarding Engine','Coordinate HR, IT and managers with clear owners, due dates and prerequisite hand-offs.',canManage?'<button class="primary" id="addOnboardingStep">+ Add step</button>':'')+
  `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h3 style="margin:0">New-joiner readiness</h3><p class="muted tiny">Blocked tasks show which prerequisite must finish first. A blocked task is not counted as an overdue owner follow-up.</p></div><strong style="color:#4f46e5;font-size:24px">${pct}%</strong></div><div class="progress" style="margin:12px 0 16px"><span style="width:${pct}%"></span></div><div class="metrics" style="margin-bottom:12px"><div class="card metric"><strong>${steps.length-done}</strong><span>Open steps</span></div><div class="card metric"><strong>${blocked}</strong><span>Blocked by prerequisite</span></div><div class="card metric"><strong>${steps.filter(overdue).length}</strong><span>Overdue · unblocked</span></div><div class="card metric"><strong>${done}</strong><span>Completed</span></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="pill done">✓ Done</span><span class="pill pending">⚠ Overdue</span><span class="pill open">↳ Blocked</span></div>
  ${steps.map(s=>{const p=prerequisite(s),b=blockedBy(s),chain=blockerChain(s),rootBlocker=chain.length?chain[chain.length-1]:null,isOverdue=overdue(s);const label=b?'Blocked — prerequisite pending':p?'Prerequisite complete: '+p.title:isOverdue?'Overdue — unblocked; follow up with owner':'Ready to progress';return `<div class="onboard-step" style="align-items:flex-start;gap:12px"><div style="flex:1;min-width:0"><strong style="font-size:13px">${escapeHTML(s.title)}</strong><div class="muted tiny" style="margin-top:4px">${escapeHTML(s.detail||'No details added')}</div><div class="muted tiny" style="margin-top:5px">Owner: <b>${escapeHTML(s.owner||'Unassigned')}</b> · Due: ${escapeHTML(s.dueDate||'Not set')}</div>${p?`<div class="tiny" style="margin-top:5px;color:${b?'#b45309':'#047857'}">${b?'↳ Waiting for':'✓ Depends on'} ${escapeHTML(p.title)} · ${escapeHTML(p.owner||'Unassigned')}</div>`:''}${rootBlocker&&rootBlocker.id!==p?.id?`<div class="tiny" style="margin-top:5px;color:#b45309">Root blocker: ${escapeHTML(rootBlocker.title)} · Owner: ${escapeHTML(rootBlocker.owner||'Unassigned')}</div>`:''}<div class="tiny" style="margin-top:5px;color:${b||isOverdue?'#b45309':'#64748b'}">${escapeHTML(label)}</div></div><div class="actions" style="flex-wrap:wrap;justify-content:flex-end"><span class="pill ${s.status==='Done'?'done':b?'open':isOverdue?'pending':'open'}">${escapeHTML(b?'Blocked':s.status||'Not started')}</span><button class="secondary small" data-step="${s.id}" ${b?'disabled title="Complete the prerequisite first"':''}>${s.status==='Done'?'Reopen':b?'Waiting':'Mark done'}</button>${canManage?'<button class="secondary small" data-edit-step="'+s.id+'">Edit</button>':''}</div></div>`}).join('')||'<p class="muted">No onboarding steps yet. Add the first step to start tracking readiness.</p>'}</div>`;
  el.querySelectorAll('[data-step]').forEach(btn=>btn.addEventListener('click',()=>{const step=byId(btn.dataset.step);if(!step)return;const p=blockedBy(step);if(step.status!=='Done'&&p){notify('Complete prerequisite first: '+p.title);return}step.status=step.status==='Done'?'In Progress':'Done';saveState();renderApp();notify('Onboarding step updated')}));
  function editStep(step){
    const dependencyOptions=['None',...steps.filter(x=>String(x.id)!==String(step?.id)).map(x=>x.title+' — '+(x.owner||'Unassigned')+' · '+(x.status||'Not started')+' (ID '+x.id+')')];
    const selected=step?.dependsOn?byId(step.dependsOn):null;
    openForm(step?'Edit onboarding step':'Add onboarding step',[
      {name:'title',label:'Step name',required:true,value:step?.title||''},
      {name:'detail',label:'What needs to happen',type:'textarea',required:true,value:step?.detail||''},
      {name:'owner',label:'Responsible owner (person or team)',required:true,value:step?.owner||''},
      {name:'dueDate',label:'Due date',type:'date',required:true,value:step?.dueDate||today},
      {name:'status',label:'Status',type:'select',options:['Not started','In Progress','Done'],required:true,value:step?.status||'Not started'},
      {name:'dependsOn',label:'Blocked by prerequisite (optional)',type:'select',options:dependencyOptions,value:selected?selected.title+' — '+(selected.owner||'Unassigned')+' · '+(selected.status||'Not started')+' (ID '+selected.id+')':'None'}
    ],v=>{const dep=String(v.dependsOn||'None');const match=dep.match(/\(ID (\d+)\)$/);const dependencyId=match?match[1]:null;if(step&&dependencyId&&String(step.id)===dependencyId){notify('A step cannot depend on itself.');return false}if(step&&dependencyId){let cursor=byId(dependencyId),visited=new Set();while(cursor&&!visited.has(String(cursor.id))){if(String(cursor.id)===String(step.id)){notify('This would create a dependency loop. Choose a different prerequisite.');return false}visited.add(String(cursor.id));cursor=cursor.dependsOn?byId(cursor.dependsOn):null;}}if(step){Object.assign(step,v,{dependsOn:dependencyId});}else steps.push({id:Date.now(),...v,dependsOn:dependencyId});const saved=step||steps[steps.length-1];const prerequisiteStep=blockedBy(saved);if(saved.status==='Done'&&prerequisiteStep){saved.status='In Progress';notify('Saved as In Progress until prerequisite is completed.')}saveState();renderApp();notify('Onboarding step saved')});
  }
  $('addOnboardingStep')?.addEventListener('click',()=>editStep(null));
  el.querySelectorAll('[data-edit-step]').forEach(btn=>btn.addEventListener('click',()=>{const step=byId(btn.dataset.editStep);if(step)editStep(step)}));
}

function localISODate(offsetDays=0){
  const date=new Date();
  date.setHours(12,0,0,0);
  date.setDate(date.getDate()+offsetDays);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}

  bg.classList.remove('hidden');
  $('modalCancel').onclick=()=>bg.classList.add('hidden');
  $('modalOk').onclick=()=>{const data={};for(const f of fields){const el=c.querySelector(`[name="${f.name}"]`);if(el&&!el.checkValidity()){el.reportValidity();return}data[f.name]=el?el.value.trim():''}if(fields.some(f=>f.required&&!data[f.name])){notify('Please fill required fields');return}const result=onSubmit(data);if(result!==false)bg.classList.add('hidden')};
}

function openAi(){
  const bg=$('modalBg'),c=$('modalContent');
  c.innerHTML=`<h3>Ask Saarthi</h3><div class="chat-box" id="chatBox"><div class="bubble bot">Hi! I can help with leave, expenses, onboarding, ESOPs, policies, or helpdesk. What do you need?</div></div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Type a question..." style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px"><button class="primary small" id="chatSend">Send</button></div><div style="text-align:right;margin-top:8px"><button class="neutral small" id="aiClose">Close</button></div>`;
  bg.classList.remove('hidden');
  function addBubble(kind,text){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=text;$('chatBox').appendChild(b);$('chatBox').scrollTop=$('chatBox').scrollHeight}
  function reply(q){
    const lower=q.toLowerCase();
    let answer='I can guide you on leave, expenses, onboarding, ESOPs, compliance, or helpdesk. Confirm company-specific rules with your People team.';
    if(lower.includes('leave'))answer='Open Leave Management and choose “Apply leave”. Supported types include Casual, Sick, Earned, Unpaid. Maternity/Paternity eligibility should be confirmed with HR and policy.';
    else if(lower.includes('expense')||lower.includes('reimburse')||lower.includes('claim'))answer='Open Reimbursements and select “New claim”. Add category, amount and description. The demo stores it locally.';
    else if(lower.includes('onboard'))answer='Open Onboarding Engine to review the sample checklist. Mark steps done to update progress.';
    else if(lower.includes('esop')||lower.includes('equity'))answer='ESOPs need clear eligibility, vesting, exercise, dilution and tax documentation. Have the plan reviewed by legal and tax professionals.';
    else if(lower.includes('policy')||lower.includes('compliance')||lower.includes('posh')||lower.includes('pf'))answer='Use the Playbook as a starting point. For India: POSH IC required above certain headcount, PF/ESI thresholds apply, and leave/gratuity rules are specific. Validate with a qualified professional.';
    else if(lower.includes('helpdesk')||lower.includes('ticket'))answer='Open Helpdesk Tickets, raise a ticket, and Founder/HR roles can mark it resolved.';
    setTimeout(()=>addBubble('bot',answer),150);
  }
  $('chatSend').onclick=()=>{const q=$('chatInput').value.trim();if(!q)return;addBubble('user',q);$('chatInput').value='';reply(q)};
  $('chatInput').onkeydown=e=>{if(e.key==='Enter'){$('chatSend').click()}};
  $('aiClose').onclick=()=>bg.classList.add('hidden');
  $('chatInput').focus();
}

function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++;}
    else if(ch==='"')quoted=!quoted;
    else if(ch===','&&!quoted){row.push(cell.trim());cell='';}
    else if((ch==='\n'||ch==='\r')&&!quoted){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cell.trim());cell='';
      if(row.some(value=>value!==''))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell.trim());if(row.some(value=>value!==''))rows.push(row);}
  if(quoted)throw new Error('CSV has an unclosed quoted field.');
  if(rows.length<2)throw new Error('CSV needs a header row and at least one employee row.');
  const headers=rows.shift().map(value=>value.replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[ _-]+/g,''));
  const column=name=>headers.indexOf(name);
  const nameCol=column('name'),roleCol=column('role');
  if(nameCol<0||roleCol<0)throw new Error('CSV must include Name and Role columns.');
  const get=(r,key,fallback='')=>{const index=column(key);return index<0?'':String(r[index]||'').trim()||fallback;};
  const employees=rows.map((r,i)=>({
    id:Math.max(0,...state.employees.map(e=>Number(e.id)||0))+i+1,
    name:String(r[nameCol]||'').trim(),
    role:String(r[roleCol]||'').trim(),
    location:get(r,'location','Remote'),
    join:get(r,'join',get(r,'joindate',new Date().toISOString().slice(0,10))),
    manager:get(r,'manager','Unassigned'),
    status:get(r,'status','Active')
  })).filter(e=>e.name&&e.role);
  if(!employees.length)throw new Error('No valid employee rows found. Each row needs Name and Role.');
  return employees;
}
$('importEmployeesFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    if(file.size>1024*1024)throw new Error('Employee CSV must be 1 MB or smaller.');
    const parsedEmployees=parseCSV(await file.text());
    const employeeKey=employee=>String(employee.name||'').trim().toLocaleLowerCase()+'|'+String(employee.role||'').trim().toLocaleLowerCase();
    const knownEmployees=new Set(state.employees.map(employeeKey));
    const imported=[];
    let duplicates=0;
    parsedEmployees.forEach(employee=>{
      const key=employeeKey(employee);
      if(knownEmployees.has(key)){duplicates++;return;}
      knownEmployees.add(key);
      imported.push(employee);
    });
    if(!imported.length)throw new Error('No new employees to import. All valid rows already exist in your directory.');
    state.employees.push(...imported);
    if(state.activeRole==='founder')markSetupStep('teamImported');
    saveState();renderApp();
    const duplicateNote=duplicates?' Skipped '+duplicates+' duplicate row'+(duplicates===1?'':'s')+'.':'';
    notify('Imported '+imported.length+' employee'+(imported.length===1?'':'s')+'.'+duplicateNote);
    if(['founder','hr'].includes(state.activeRole)){
      currentTab='directory';renderApp();
    }
  }catch(err){notify(err.message||'Could not import employee CSV.');}
  finally{e.target.value='';}
});
$('importDataFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    if(!window.confirm('Importing a backup replaces the current demo data in this browser. Export a backup first if you want to keep the current data. Continue?'))return;
    if(file.size>2*1024*1024)throw new Error('Backup must be 2 MB or smaller.');
    const parsed=JSON.parse(await file.text());
    const incoming=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;
    const arrays=['employees','leaves','reimbursements','shoutouts','tickets','onboarding'];
    if(!incoming||!arrays.every(k=>Array.isArray(incoming[k])))throw new Error('This file is not a valid Saarthi backup. Required data sections are missing.');
    if(incoming.activeRole&&!roles[incoming.activeRole])throw new Error('The backup contains an unsupported role.');
    const restored={...clone(seedData),...incoming};
    arrays.forEach(k=>{if(!Array.isArray(restored[k]))throw new Error('Invalid '+k+' section.')});
    state=restored;
    saveState();
    $('roleSelector').value=roles[state.activeRole]?state.activeRole:'founder';
    currentTab=roles[state.activeRole]?roles[state.activeRole].nav[0][0]:'dashboard';
    renderApp();
    notify('Backup restored successfully.');
  }catch(err){notify(err.message||'Could not restore this backup.');}
  finally{e.target.value='';}
});
