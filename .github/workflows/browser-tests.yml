name: Saarthi browser regression tests

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/saarthi-http.log 2>&1 &
          echo $! > /tmp/saarthi-http.pid
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
