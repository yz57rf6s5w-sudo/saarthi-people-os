name: Record silent feature-led Saarthi walkthrough

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-recording.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Record silent feature-led product walkthrough with captions
        run: |
          mkdir -p videos
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
              recordVideo: { dir: 'videos', size: { width: 1440, height: 900 } }
            });
            const page = await context.newPage();
            page.setDefaultTimeout(9000);

            const slides = [
              {
                title: 'SAARTHI PEOPLE OS',
                body: 'People operations, guided from one connected workspace.',
                detail: 'Instead of chasing scattered requests, each person gets a role-specific view of the tasks, information and next steps relevant to them.'
              },
              {
                title: 'THE PROBLEM: PEOPLE WORK IS FRAGMENTED',
                body: 'Budgets sit apart from hiring. Requests sit in chats. Teams lack a shared view.',
                detail: 'When people processes are disconnected, founders lose visibility, People Ops spends time following up, managers miss team context, and employees are unsure where to go. Saarthi is designed to bring these journeys closer together.'
              },
              {
                title: 'THE SAARTHI APPROACH',
                body: 'Find the next step. See the context. Move the work forward.',
                detail: 'Saarthi is intended to act like a north star for people operations: guide each role to relevant workflows, make responsibilities clearer, and support human decisions with useful information—not replace human judgement.'
              },
              {
                title: 'ONE PRODUCT. FIVE ROLE-BASED JOURNEYS.',
                body: 'Founder · People Ops · Manager · Employee · Candidate',
                detail: 'The interface changes with the role. Founders focus on workforce and cost decisions; People Ops coordinates processes; managers review requests with team context; employees use self-service; candidates follow the hiring-facing journey.'
              },
              {
                title: 'FOUNDER: PLAN THE PEOPLE SIDE OF THE BUSINESS',
                body: 'Connect workforce needs, people expense and hiring priorities.',
                detail: 'The founder view is intended to make headcount and people-cost planning easier to review, helping founders think about which roles are needed, what they may cost, and how people requirements support business plans.'
              },
              {
                title: 'PEOPLE OPS: KEEP THE JOURNEY MOVING',
                body: 'Coordinate employee processes without losing the bigger picture.',
                detail: 'People Ops needs a working view of employee records, onboarding and people workflows so the team can see what needs attention, reduce repetitive follow-ups and support employees consistently. The screens shown reflect the current prototype.'
              },
              {
                title: 'MANAGER: DECIDE WITH TEAM CONTEXT',
                body: 'Review leave alongside availability and workload.',
                detail: 'A leave request affects more than one person. The manager experience aims to make leave history, who is available and current workload visible during review, so approvals can consider team coverage as well as the individual request.'
              },
              {
                title: 'EMPLOYEE: SELF-SERVICE WITH A CLEAR NEXT STEP',
                body: 'Know where to go, what to submit and what happens next.',
                detail: 'Employees should not need to chase the right person for every routine task. A role-specific workspace brings relevant requests, claims, leave and people information closer to the employee, based on the features available in the prototype.'
              },
              {
                title: 'CANDIDATE: A CLEARER HIRING-FACING JOURNEY',
                body: 'Keep candidate-facing steps distinct from employee operations.',
                detail: 'The candidate role represents the hiring-facing experience. This walkthrough shows the current demo screens only; it does not imply a live applicant tracking system or connected recruitment service.'
              },
              {
                title: 'AI WORKFORCE: PLAN CAPACITY BEYOND HEADCOUNT',
                body: 'Consider AI-assisted work alongside your human team.',
                detail: 'The AI Workforce concept treats AI capacity as a planned resource, not a human employee. Explore the idea of assigning a bounded role or task, estimating monthly budget, and naming a human owner who remains accountable.'
              },
              {
                title: 'AI WORKFORCE: CLEAR TASKS. HUMAN ACCOUNTABILITY.',
                body: 'Use AI for bounded support tasks; keep consequential decisions human-led.',
                detail: 'Potential support tasks include drafting, summarising or preparing a first-pass brief. The person responsible should review outputs, validate facts and approve consequential actions. The demo does not activate a live AI worker or connected AI service.'
              },
              {
                title: 'ASK SAARTHI: HELP WITHIN THE WORKFLOW',
                body: 'A conversational assistant concept for finding guidance.',
                detail: 'The assistant interface represents the idea of getting help without leaving the people journey. This prototype view does not imply live AI responses, access to company records or automated actions.'
              },
              {
                title: 'PLUG-AND-PLAY DIRECTION',
                body: 'Set up the organisation, add people, assign roles and configure workflows.',
                detail: 'The intended path is to configure the workspace, bring in people using supported options, set roles and approval owners, and introduce workflows step by step. Actual integrations, migration needs and production readiness must be validated for each deployment.'
              },
              {
                title: 'BUILT TO GUIDE, NOT ADD MORE PROCESS',
                body: 'Relevant context for each role. Clearer actions. People stay in control.',
                detail: 'Saarthi’s differentiator is the ambition to combine role-aware workflows with practical decision context and guided assistance. Treat the current video as a product concept walkthrough: some capabilities are demonstrative and are not yet production services.'
              }
            ];

            async function overlay(title, body, detail = '') {
              await page.evaluate(({ title, body, detail }) => {
                let el = document.getElementById('saarthi-recording-overlay');
                if (!el) {
                  el = document.createElement('div');
                  el.id = 'saarthi-recording-overlay';
                  Object.assign(el.style, {
                    position: 'fixed', left: '42px', right: '42px', bottom: '34px', zIndex: '2147483647',
                    display: 'flex', flexDirection: 'column', justifyContent: 'center',
                    padding: '22px 30px', borderRadius: '18px',
                    background: 'linear-gradient(110deg, rgba(15,23,42,.96), rgba(49,46,129,.93))',
                    border: '1px solid rgba(196,181,253,.35)', boxShadow: '0 18px 50px rgba(0,0,0,.28)',
                    color: '#fff', fontFamily: 'Inter, system-ui, sans-serif',
                    pointerEvents: 'none', boxSizing: 'border-box'
                  });
                  el.innerHTML = '<div style="max-width:1120px"><div id="saarthi-overline" style="font-size:12px;font-weight:800;letter-spacing:.16em;color:#c4b5fd;margin-bottom:8px">SAARTHI PEOPLE OS</div><div id="saarthi-slide-title" style="font-size:28px;line-height:1.15;letter-spacing:-.025em;font-weight:850;margin-bottom:8px"></div><div id="saarthi-slide-body" style="font-size:19px;line-height:1.35;font-weight:600;max-width:1200px;margin-bottom:6px"></div><div id="saarthi-slide-detail" style="font-size:14px;line-height:1.45;color:#dbe3f5;max-width:1200px"></div><div style="margin-top:10px;font-size:10px;letter-spacing:.12em;color:#a5b4fc">A PEOPLE OS CONCEPT · SYNTHETIC DEMO DATA</div></div>';
                  document.body.appendChild(el);
                }
                document.getElementById('saarthi-overline').textContent = 'SAARTHI PEOPLE OS';
                document.getElementById('saarthi-slide-title').textContent = title;
                document.getElementById('saarthi-slide-body').textContent = body;
                document.getElementById('saarthi-slide-detail').textContent = detail;
                el.style.display = 'flex';
              }, { title, body, detail });
            }

            async function hideOverlay() {
              await page.evaluate(() => {
                const el = document.getElementById('saarthi-recording-overlay');
                if (el) el.style.display = 'none';
              });
            }

            async function pause(ms) { await page.waitForTimeout(ms); }

            await page.goto('https://yz57rf6s5w-sudo.github.io/saarthi-people-os/', { waitUntil: 'networkidle', timeout: 60000 });
            await pause(900);

            for (const s of slides) {
              await overlay(s.title, s.body, s.detail);
              await pause(4200);
            }

            await hideOverlay();
            await pause(1800);

            // Use only synthetic demo data; never enter real employee or candidate data.
            await page.locator('#loginName').fill('Saarthi Demo');
            await page.locator('#demoCode').fill('demo123');
            await page.locator('#loginRole').selectOption('founder');
            await page.getByRole('button', { name: /enter workspace/i }).click();
            await pause(1400);

            const roleInfo = {
              founder: ['FOUNDER / CEO', 'People-cost planning, workforce requirements and company-level visibility.'],
              hr: ['PEOPLE OPS', 'Coordinate onboarding, employee processes and day-to-day people operations.'],
              manager: ['TEAM MANAGER', 'Review requests with leave, availability and workload context.'],
              employee: ['EMPLOYEE EXPERIENCE', 'Access personal workflows and everyday people self-service.'],
              candidate: ['CANDIDATE EXPERIENCE', 'Explore the hiring-facing experience and candidate workflow.']
            };

            async function closeAskSaarthiIfOpen() {
              // The prototype's Ask Saarthi panel has a specific Close button.
              // Close it explicitly before role changes or navigation.
              try {
                const close = page.locator('#aiClose');
                if (await close.count() && await close.isVisible().catch(() => false)) {
                  await close.click({ timeout: 1500 });
                  await pause(350);
                }
              } catch (e) {}
              try { await page.keyboard.press('Escape'); } catch (e) {}
              await pause(250);
            }

            // Dedicated AI Workforce feature tour: show real founder screens and label the intended workflow.
            await closeAskSaarthiIfOpen();
            try {
              const roleSelector = page.locator('#roleSelector');
              if (await roleSelector.count()) {
                await roleSelector.selectOption('founder');
                await pause(900);
              }
              await overlay('AI WORKFORCE: PLAN CAPACITY BEYOND HEADCOUNT', 'Consider AI-assisted work alongside your human team.', 'Plan a bounded role or task, estimate monthly budget, and assign a human owner who remains accountable.');
              await pause(3000);
              await hideOverlay();

              const aiNavLabels = ['AI WORKFORCE', 'AI WORKERS', 'WORKFORCE PLANNING', 'PEOPLE BUDGET'];
              const navButtons = page.locator('#nav button');
              let aiFeatureOpened = false;
              for (let i = 0; i < await navButtons.count(); i++) {
                const item = navButtons.nth(i);
                const label = (await item.innerText().catch(() => '')).trim().replace(/\\s+/g, ' ');
                if (aiNavLabels.some(term => label.toUpperCase().includes(term))) {
                  await item.click();
                  await pause(500);
                  await overlay('AI WORKFORCE · FEATURE VIEW', 'What work could AI assist with—and who owns the outcome?', 'Use the available prototype controls to explore role, budget, ownership and bounded tasks. Human review remains essential; this demo does not activate a live AI worker.');
                  await pause(4200);
                  await hideOverlay();
                  await pause(500);
                  aiFeatureOpened = true;
                  console.log('Captured AI Workforce navigation feature:', label);
                }
              }

              // Open the Ask Saarthi assistant from the founder view as an adjacent AI-assistance capability.
              try {
                const aiOpen = page.locator('#aiOpen');
                if (await aiOpen.count() && await aiOpen.isVisible()) {
                  await aiOpen.click();
                  await overlay('ASK SAARTHI: GUIDANCE IN CONTEXT', 'Get help finding the next step without leaving the people journey.', 'This is an assistant-interface concept only. It does not imply live AI responses, company-record access or automated actions.');
                  await pause(3500);
                  await closeAskSaarthiIfOpen();
                }
              } catch (e) {
                console.log('Ask Saarthi feature capture skipped:', String(e));
              }
              if (!aiFeatureOpened) {
                await overlay('AI WORKFORCE · CONCEPT', 'Plan AI-assisted capacity with clear ownership and human oversight.', 'The current prototype may not expose a dedicated AI Workforce navigation screen. This caption identifies the intended feature without presenting it as a live integration.');
                await pause(2600);
                await hideOverlay();
              }
            } catch (e) {
              console.log('AI Workforce tour fallback:', String(e));
              await overlay('AI WORKFORCE', 'AI-assisted capacity, clear ownership, bounded tasks and human oversight.', 'Feature concept · shown separately from existing human headcount.');
              await pause(2400);
              await hideOverlay();
            }

            for (const role of Object.keys(roleInfo)) {
              await closeAskSaarthiIfOpen();
              const roleSelector = page.locator('#roleSelector');
              if (await roleSelector.count()) {
                try {
                  await roleSelector.selectOption(role);
                  await pause(1300);
                } catch (e) {
                  console.log('Could not switch to role:', role, String(e));
                  continue;
                }
              }

              const [roleTitle, roleDescription] = roleInfo[role];
              await overlay(roleTitle, roleDescription, 'Feature walkthrough · current public prototype · synthetic demo data');
              await pause(1700);
              await hideOverlay();

              const nav = page.locator('#nav button');
              const count = await nav.count();
              console.log('Role', role, 'navigation items:', count);

              for (let i = 0; i < count; i++) {
                const item = nav.nth(i);
                try {
                  const label = (await item.innerText()).trim().replace(/\\s+/g, ' ');
                  await item.click();
                  const featureTip = {
                    founder: 'See the founder-facing view for people priorities and workforce decisions.',
                    hr: 'See the People Ops view for coordinating people processes and employee support.',
                    manager: 'Review the team view with requests, leave, availability and workload context.',
                    employee: 'See the employee-facing self-service experience and personal actions.',
                    candidate: 'See the candidate-facing workflow available in this concept prototype.'
                  }[role];
                  await overlay(label.toUpperCase(), featureTip, 'Feature shown in the current prototype · interactions and data may be demonstrative.');
                  await pause(3000);
                  await hideOverlay();
                  await pause(700);
                  console.log('Captured functional screen:', role, '-', label);
                } catch (e) {
                  console.log('Skipped navigation item:', role, i, String(e));
                }
              }

              if (role === 'founder') {
                try {
                  await page.locator('#aiOpen').click();
                  await overlay('ASK SAARTHI', 'A conversational assistant interface concept.', 'This recording does not imply live AI or company-record integration.');
                  await pause(2800);
                  await closeAskSaarthiIfOpen();
                  await pause(700);
                } catch (e) {
                  console.log('Ask Saarthi panel not opened:', String(e));
                }
              }
            }

            await overlay('PRODUCT PHILOSOPHY', 'Guide. Assist. Empower people to decide.', 'Saarthi aims to make people operations intuitive and connected, keep decisions human-led, and build trust through clarity, role-appropriate access and secure foundations.');
            await pause(2200);
            await overlay('THANK YOU FOR EXPLORING SAARTHI', 'A People OS concept for growing teams.', 'Guidance over complexity. Context over scattered processes. Human judgement supported by useful tools. Some capabilities shown are demonstrative, not production services.');
            await pause(2200);

            const video = page.video();
            await context.close();
            const path = await video.path();
            const fs = require('fs');
            fs.copyFileSync(path, 'videos/saarthi-prototype-walkthrough.webm');
            await browser.close();
            console.log('Video saved to videos/saarthi-prototype-walkthrough.webm');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload walkthrough video
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-prototype-walkthrough
          path: videos/saarthi-prototype-walkthrough.webm
          if-no-files-found: error
          retention-days: 14
