name: Record Saarthi prototype walkthrough

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype-recording.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Record actual browser walkthrough
        run: |
          mkdir -p videos
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
              recordVideo: { dir: 'videos', size: { width: 1440, height: 900 } }
            });
            const page = await context.newPage();
            page.setDefaultTimeout(7000);

            await page.goto('https://yz57rf6s5w-sudo.github.io/saarthi-people-os/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3500);

            // Enter only synthetic demo data in the public prototype.
            await page.locator('#loginName').fill('Saarthi Demo');
            await page.locator('#demoCode').fill('demo123');
            await page.locator('#loginRole').selectOption('founder');
            await page.getByRole('button', { name: /enter workspace/i }).click();
            await page.waitForTimeout(5000);

            // Walk each role and its visible navigation. Wait between screens so
            // the resulting video is readable, not just a rapid automated sweep.
            const roles = ['founder', 'hr', 'manager', 'employee', 'candidate'];
            for (const role of roles) {
              const roleSelector = page.locator('#roleSelector');
              if (await roleSelector.count()) {
                try {
                  await roleSelector.selectOption(role);
                  await page.waitForTimeout(3000);
                } catch (e) {
                  console.log('Could not switch to role:', role, String(e));
                  continue;
                }
              }

              const nav = page.locator('#nav button');
              const count = await nav.count();
              console.log('Role', role, 'navigation items:', count);
              for (let i = 0; i < count; i++) {
                const item = nav.nth(i);
                try {
                  const label = (await item.innerText()).trim().replace(/\\s+/g, ' ');
                  await item.click();
                  console.log('Captured screen:', role, '-', label);
                  await page.waitForTimeout(3200);
                } catch (e) {
                  console.log('Skipped navigation item:', role, i, String(e));
                }
              }

              // Include the Ask Saarthi interface if available.
              if (role === 'founder') {
                try {
                  await page.locator('#aiOpen').click();
                  await page.waitForTimeout(4500);
                  await page.keyboard.press('Escape');
                  await page.waitForTimeout(1000);
                } catch (e) {
                  console.log('Ask Saarthi panel not opened:', String(e));
                }
              }
            }

            await page.waitForTimeout(1500);
            const video = page.video();
            await context.close();
            await browser.close();
            const path = await video.path();
            const fs = require('fs');
            fs.copyFileSync(path, 'videos/saarthi-prototype-walkthrough.webm');
            console.log('Video saved to videos/saarthi-prototype-walkthrough.webm');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload walkthrough video
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-prototype-walkthrough
          path: videos/saarthi-prototype-walkthrough.webm
          if-no-files-found: error
          retention-days: 14
